apiVersion: batch/v1
kind: Job
metadata:
  name: listmonk-install
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: listmonk-install
    spec:
      restartPolicy: Never
      serviceAccountName: listmonk-secrets
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: install
          image: listmonk/listmonk:v6.1.0@sha256:179d00d9553c371b6fe88c9b145095d651e275bdd66db46b2e0b79daff316b6f
          command: [/listmonk/listmonk]
          args: [--install, --idempotent, --yes, --config, ""]
          envFrom:
            - configMapRef:
                name: listmonk
          env:
            - name: LISTMONK_db__password
              valueFrom:
                secretKeyRef:
                  name: listmonk-db-app
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: uploads
              mountPath: /listmonk/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          emptyDir:
            sizeLimit: 100Mi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
