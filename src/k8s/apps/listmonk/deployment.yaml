apiVersion: apps/v1
kind: Deployment
metadata:
  name: listmonk
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    reloader.stakater.com/auto: "true"
    ignore-check.kube-linter.io/run-as-non-root: "Only the one-shot network init runs as root to add the pod-local metadata address."
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: listmonk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: listmonk
      annotations:
        eks.amazonaws.com/skip-containers: listmonk,imds-address
    spec:
      serviceAccountName: listmonk
      automountServiceAccountToken: false
      hostNetwork: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: imds-address
          image: alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0
          command: [ip, address, add, 169.254.169.254/32, dev, lo]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
        - name: imds
          image: ghcr.io/glitchedmob/imds-credential-server:v1.0.1@sha256:8b4fca516f204dcd8a092b93ce55388c2e8220b26cf7ffc8a8be253ba71639d7
          restartPolicy: Always
          args: [--listen, "169.254.169.254:80"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          startupProbe:
            exec:
              command: [/imds-credential-server, healthcheck, --url, "http://169.254.169.254/readyz"]
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 12
          readinessProbe:
            exec:
              command: [/imds-credential-server, healthcheck, --url, "http://169.254.169.254/readyz"]
            periodSeconds: 15
            timeoutSeconds: 6
          livenessProbe:
            exec:
              command: [/imds-credential-server, healthcheck, --url, "http://169.254.169.254/healthz"]
            periodSeconds: 30
            timeoutSeconds: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      containers:
        - name: listmonk
          image: listmonk/listmonk:v6.1.0@sha256:179d00d9553c371b6fe88c9b145095d651e275bdd66db46b2e0b79daff316b6f
          command: [/listmonk/listmonk]
          args: [--config, ""]
          ports:
            - name: http
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: listmonk
          env:
            - name: LISTMONK_db__password
              valueFrom:
                secretKeyRef:
                  name: listmonk-db-app
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: uploads
              mountPath: /listmonk/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          emptyDir:
            sizeLimit: 100Mi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
