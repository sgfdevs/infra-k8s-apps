apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: listmonk-tls
spec:
  secretName: listmonk-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
  dnsNames:
    - newsletter.sgf.dev
