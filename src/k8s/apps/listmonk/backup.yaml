apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: listmonk-backup
  labels:
    backup.k8up.io/app: listmonk
spec:
  backupCommand: >-
    sh -ec 'pg_dump
    --host=listmonk-db-rw
    --username=listmonk
    --dbname=listmonk
    --format=custom
    --no-owner
    --no-privileges'
  fileExtension: .dump
  pod:
    spec:
      serviceAccountName: listmonk-backup
      automountServiceAccountToken: false
      containers:
        - name: backup
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          command: [sh, -c, sleep 3600]
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: listmonk-db-app
                  key: password
            - name: PGSSLMODE
              value: require
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: listmonk-backup
spec:
  backend:
    repoPasswordSecretRef:
      name: listmonk-k8up-repo-password
      key: password
    s3:
      endpoint: https://s3.us-east-005.backblazeb2.com
      bucket: sgfdevs-on-prem-k3s-backups/listmonk
      accessKeyIDSecretRef:
        name: k8up-b2-credentials
        key: account-id
      secretAccessKeySecretRef:
        name: k8up-b2-credentials
        key: account-key
  backup:
    schedule: '0 8 * * *'
    activeDeadlineSeconds: 1800
    clusterName: sgfdevs
    promURL: http://prometheus-pushgateway.observability.svc.cluster.local:9091
    failedJobsHistoryLimit: 2
    successfulJobsHistoryLimit: 2
    labelSelectors:
      - matchLabels:
          backup.k8up.io/app: listmonk
  check:
    schedule: '0 9 * * 1'
    activeDeadlineSeconds: 1800
  prune:
    schedule: '0 10 * * 0'
    activeDeadlineSeconds: 1800
    retention:
      keepLast: 5
      keepDaily: 14
      keepWeekly: 4
