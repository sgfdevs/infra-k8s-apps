apiVersion: v1
kind: ConfigMap
metadata:
  name: methodconf-cms
data:
  Umbraco__CMS__Global__Smtp__From: Method Conf <website-staging@methodconf.com>
  Umbraco__CMS__WebRouting__UmbracoApplicationUrl: https://cms-staging.methodconf.com/
  MethodConf__Site__SearchIndexingEnabled: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: methodconf-frontend
data:
  CMS_PUBLIC_URL: https://cms-staging.methodconf.com/
  SEARCH_INDEXING_ENABLED: "false"
  SITE_URL: https://staging.methodconf.com/
