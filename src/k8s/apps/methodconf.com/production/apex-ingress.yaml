apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: methodconf-apex
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: methodconf-com-production-methodconf-www-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - methodconf.com
      secretName: methodconf-tls
  rules:
    - host: methodconf.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: methodconf-frontend
                port:
                  number: 80
