apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: methodconf-frontend
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: methodconf-com-production-methodconf-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.methodconf.com
      secretName: methodconf-tls
  rules:
    - host: www.methodconf.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: methodconf-frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: methodconf-cms
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: methodconf-com-production-methodconf-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cms.methodconf.com
      secretName: methodconf-tls
  rules:
    - host: cms.methodconf.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: methodconf-cms
                port:
                  number: 80
