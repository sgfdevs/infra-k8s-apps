- op: replace
  path: /metadata/name
  value: methodconf-backup
- op: replace
  path: /metadata/labels/backup.k8up.io~1app
  value: methodconf
- op: replace
  path: /spec/fileExtension
  value: .tar.gz
- op: replace
  path: /spec/backupCommand
  value: >-
    sh -ec '
      apk add --no-cache sqlite tar >/dev/null;
      database=/data/database/Umbraco.sqlite.db;
      staging=$(mktemp -d);
      trap "rm -rf $staging" EXIT;
      mkdir -p "$staging/database";
      snapshot="$staging/database/Umbraco.sqlite.db";
      test -s "$database";
      test -d /data/media;
      test -d /data/data-protection-keys;
      sqlite3 "$database" ".timeout 60000" ".backup $snapshot";
      test "$(sqlite3 "$snapshot" "PRAGMA integrity_check;")" = ok;
      tar -czf - -C "$staging" database -C /data media data-protection-keys
    '
- op: replace
  path: /spec/pod/spec/serviceAccountName
  value: methodconf-backup
- op: replace
  path: /spec/pod/spec/containers/0/image
  value: alpine:3.22.1
- op: add
  path: /spec/pod/spec/affinity
  value:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: methodconf-cms
          topologyKey: kubernetes.io/hostname
- op: add
  path: /spec/pod/spec/containers/0/volumeMounts
  value:
    - name: data
      mountPath: /data
- op: add
  path: /spec/pod/spec/volumes
  value:
    - name: data
      persistentVolumeClaim:
        claimName: methodconf-cms-data
