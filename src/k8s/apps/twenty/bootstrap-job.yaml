apiVersion: batch/v1
kind: Job
metadata:
  name: twenty-bootstrap-v2-41-0
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twenty-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: twenty-secrets
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: twentycrm/twenty:v2.41.0@sha256:47bcefe4e497ceef232f149153a4a61379830f5c898b7da71a5b0e21fd5ea916
          command: ["/bin/sh", "/opt/twenty/start.sh"]
          args: ["/bin/sh", "/opt/twenty/bootstrap.sh"]
          envFrom:
            - configMapRef:
                name: twenty-config
            - secretRef:
                name: twenty
          env:
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: twenty-db-app
                  key: uri
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: twenty-valkey-auth
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /opt/twenty
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: scripts
          configMap:
            name: twenty-scripts
