apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: twenty-tls
spec:
  secretName: twenty-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
  dnsNames:
    - crm-preview.sgf.dev
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: twenty-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: twenty-preview-auth
spec:
  basicAuth:
    secret: twenty-preview-auth
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twenty
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    traefik.ingress.kubernetes.io/router.middlewares: twenty-twenty-https-redirect@kubernetescrd,twenty-twenty-preview-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - crm-preview.sgf.dev
      secretName: twenty-tls
  rules:
    - host: crm-preview.sgf.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twenty
                port:
                  name: http
