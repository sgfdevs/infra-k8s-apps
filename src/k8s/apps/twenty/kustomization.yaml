apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: twenty
resources:
  - namespace.yaml
  - service-account.yaml
  - secrets.yaml
  - database.yaml
  - valkey.yaml
  - config.yaml
  - bootstrap-job.yaml
  - deployments.yaml
  - service.yaml
  - pdb.yaml
  - ingress.yaml
configMapGenerator:
  - name: twenty-scripts
    files:
      - scripts/start.sh
      - scripts/bootstrap.sh
      - scripts/readiness.cjs
generatorOptions:
  # The completed bootstrap Job must retain an immutable Pod template.
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: "0"
labels:
  - pairs:
      app.kubernetes.io/part-of: twenty
