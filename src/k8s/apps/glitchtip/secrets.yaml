        key: glitchtip/oidc
        property: discoveryUrl
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-smtp
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: glitchtip-smtp
    creationPolicy: Owner
  data:
    - secretKey: EMAIL_HOST
      remoteRef:
        key: glitchtip/ses
        property: host
    - secretKey: EMAIL_PORT
      remoteRef:
        key: glitchtip/ses
        property: port
    - secretKey: EMAIL_HOST_USER
      remoteRef:
        key: glitchtip/ses
        property: username
    - secretKey: EMAIL_HOST_PASSWORD
      remoteRef:
        key: glitchtip/ses
        property: password
    - secretKey: DEFAULT_FROM_EMAIL
      remoteRef:
        key: glitchtip/ses
        property: fromAddress
---
