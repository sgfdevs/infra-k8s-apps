apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: glitchtip-app
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: glitchtip/app
        property: secretKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-oidc
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: glitchtip-oidc
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
