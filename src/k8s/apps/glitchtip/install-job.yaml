apiVersion: batch/v1
kind: Job
metadata:
  name: glitchtip-install
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glitchtip-install
    spec:
      restartPolicy: Never
      serviceAccountName: glitchtip
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 5000
        runAsGroup: 5000
        fsGroup: 5000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: install
          image: glitchtip/glitchtip:6.2.3@sha256:95e0e2d6b1bc18446902ae0cb47910cc55d7c0d6756ee901b0cd8dce9f8ef5a9
          command: [sh, -ec]
          args:
            - ./bin/run-migrate.sh && python /scripts/bootstrap.py
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: glitchtip-config
            - secretRef:
                name: glitchtip-app
            - secretRef:
                name: glitchtip-oidc
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glitchtip-db-app
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: glitchtip-scripts
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
