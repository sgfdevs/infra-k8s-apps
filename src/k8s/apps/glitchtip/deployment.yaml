apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    secret.reloader.stakater.com/reload: glitchtip-app,glitchtip-smtp,glitchtip-db-app,glitchtip-s3-credentials,glitchtip-oidc
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: glitchtip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glitchtip
      annotations:
        k8up.io/backup: "false"
    spec:
      serviceAccountName: glitchtip
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 5000
        runAsGroup: 5000
        fsGroup: 5000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: glitchtip
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: configure
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          command: [/bin/sh, -ec]
          args:
            - |
              if ! psql -X -q -f /scripts/settings.sql >/dev/null 2>&1; then
                echo "Failed to apply GlitchTip settings" >&2
                exit 1
              fi
          envFrom:
            - configMapRef:
                name: glitchtip-config
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: glitchtip-db-app
                  key: host
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: glitchtip-db-app
                  key: dbname
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: glitchtip-db-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: glitchtip-db-app
                  key: password
            - name: PGSSLMODE
              value: require
            - name: PGCONNECT_TIMEOUT
              value: "10"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: settings
              mountPath: /scripts
              readOnly: true
            - name: desired-settings
              mountPath: /settings
              readOnly: true
      containers:
        - name: glitchtip
          image: glitchtip/glitchtip:6.2.3@sha256:95e0e2d6b1bc18446902ae0cb47910cc55d7c0d6756ee901b0cd8dce9f8ef5a9
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: glitchtip-config
            - secretRef:
                name: glitchtip-app
            - secretRef:
                name: glitchtip-smtp
            - secretRef:
                name: glitchtip-s3-credentials
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glitchtip-db-app
                  key: password
          startupProbe:
            httpGet:
              path: /_health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: settings
          configMap:
            name: glitchtip-settings
        - name: desired-settings
          secret:
            secretName: glitchtip-oidc
            items:
              - key: OIDC_CLIENT_SECRET
                path: client-secret
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: glitchtip
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: glitchtip
