apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    secret.reloader.stakater.com/reload: glitchtip-app,glitchtip-smtp,glitchtip-db-app,glitchtip-s3-credentials
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: glitchtip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glitchtip
      annotations:
        k8up.io/backup: "false"
    spec:
      serviceAccountName: glitchtip
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 5000
        runAsGroup: 5000
        fsGroup: 5000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: glitchtip
              topologyKey: kubernetes.io/hostname
      containers:
        - name: glitchtip
          image: glitchtip/glitchtip:6.2.3@sha256:95e0e2d6b1bc18446902ae0cb47910cc55d7c0d6756ee901b0cd8dce9f8ef5a9
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: glitchtip-config
            - secretRef:
                name: glitchtip-app
            - secretRef:
                name: glitchtip-smtp
            - secretRef:
                name: glitchtip-s3-credentials
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glitchtip-db-app
                  key: password
          startupProbe:
            httpGet:
              path: /_health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_health/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: glitchtip
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: glitchtip
