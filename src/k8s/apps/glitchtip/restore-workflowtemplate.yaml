apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: glitchtip-restore
spec:
  entrypoint: restore
  onExit: cleanup
  serviceAccountName: glitchtip-restore-workflow
  synchronization:
    mutexes:
      - name: glitchtip-maintenance
  arguments:
    parameters:
      - name: snapshot-id
        value: latest
      - name: confirmation
        description: Enter "RESTORE glitchtip" to confirm replacement of the database and uploads.
  activeDeadlineSeconds: 3600
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 10m
  volumeClaimTemplates:
    - metadata:
        name: restore-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
  templates:
    - name: restore
      steps:
        - - name: validate
            template: validate
        - - name: download
            template: download
        - - name: pause
            template: pause
        - - name: verify-paused
            template: verify-paused
        - - name: restore-uploads
            template: restore-uploads
        - - name: restore-database
            template: restore-database
        - - name: initialize
            template: initialize
    - name: validate
      container:
        image: alpine/k8s:1.36.2
        command: [/scripts/validate-restore.sh]
        env:
          - name: SNAPSHOT_ID
            value: "{{workflow.parameters.snapshot-id}}"
          - name: CONFIRMATION
            value: "{{workflow.parameters.confirmation}}"
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: glitchtip-workflow-scripts
            defaultMode: 0555
    - name: download
      container:
        image: restic/restic:0.18.1
        command: [/scripts/download-restore.sh]
        env:
          - name: SNAPSHOT_ID
            value: "{{workflow.parameters.snapshot-id}}"
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: glitchtip-app
                key: SECRET_KEY
          - name: RESTIC_REPOSITORY
            value: s3:https://s3.us-east-005.backblazeb2.com/sgfdevs-on-prem-k3s-backups/glitchtip
          - name: RESTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: glitchtip-k8up-repo-password
                key: password
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: k8up-b2-credentials
                key: account-id
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: k8up-b2-credentials
                key: account-key
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
          - name: restore-data
            mountPath: /restore
      volumes:
        - name: scripts
          configMap:
            name: glitchtip-workflow-scripts
            defaultMode: 0555
    - name: pause
      container:
        image: alpine/k8s:1.36.2
        command: [/scripts/pause-restore.sh]
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: glitchtip-workflow-scripts
            defaultMode: 0555
    - name: verify-paused
      container:
        image: alpine/k8s:1.36.2
        command: [/scripts/verify-paused.sh]
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: glitchtip-workflow-scripts
            defaultMode: 0555
    - name: restore-uploads
      container:
        image: amazon/aws-cli:2.35.16
        command: [sh, -ec]
        args:
          - aws --endpoint-url "$AWS_S3_ENDPOINT_URL" s3 sync /restore/uploads "s3://$AWS_STORAGE_BUCKET_NAME" --only-show-errors
        envFrom:
          - configMapRef:
              name: glitchtip-config
          - secretRef:
              name: glitchtip-s3-credentials
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
          - name: restore-data
            mountPath: /restore
            readOnly: true
    - name: restore-database
      container:
        image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
        command: [/scripts/restore-database.sh]
        env:
          - name: PGHOST
            value: glitchtip-db-rw
          - name: PGDATABASE
            value: glitchtip
          - name: PGUSER
            value: glitchtip
          - name: PGSSLMODE
            value: require
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: glitchtip-db-app
                key: password
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
          - name: restore-data
            mountPath: /restore
      volumes:
        - name: scripts
          configMap:
            name: glitchtip-workflow-scripts
            defaultMode: 0555
    - name: initialize
      container:
        image: glitchtip/glitchtip:6.2.3@sha256:95e0e2d6b1bc18446902ae0cb47910cc55d7c0d6756ee901b0cd8dce9f8ef5a9
        command: [sh, -ec]
        args:
          - ./bin/run-migrate.sh && python /scripts/bootstrap.py
        securityContext:
          runAsNonRoot: true
          runAsUser: 5000
          runAsGroup: 5000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        envFrom:
          - configMapRef:
              name: glitchtip-config
          - secretRef:
              name: glitchtip-app
          - secretRef:
              name: glitchtip-oidc
        env:
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: glitchtip-db-app
                key: password
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
          - name: bootstrap
            mountPath: /scripts
          - name: tmp
            mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: glitchtip-scripts
        - name: tmp
          emptyDir: {}
    - name: cleanup
      container:
        image: alpine/k8s:1.36.2
        command: [/scripts/cleanup-restore.sh]
        env:
          - name: WORKFLOW_STATUS
            value: "{{workflow.status}}"
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: glitchtip-workflow-scripts
            defaultMode: 0555
