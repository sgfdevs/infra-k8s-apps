apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: kaneo-restore-resume
spec:
  entrypoint: resume
  serviceAccountName: kaneo-restore-workflow
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: tmp
      emptyDir: {}
  synchronization:
    mutexes:
      - name: kaneo-maintenance
  arguments:
    parameters:
      - name: confirmation
        description: Enter "RESUME kaneo" after inspecting a failed restore.
  activeDeadlineSeconds: 600
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 10m
  templates:
    - name: resume
      container:
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        image: alpine/k8s:1.36.2
        command: [/scripts/manual-resume.sh]
        env:
          - name: HOME
            value: /tmp
          - name: WORKFLOW_OWNER
            value: "{{workflow.uid}}"
          - name: CONFIRMATION
            value: "{{workflow.parameters.confirmation}}"
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: scripts
            mountPath: /scripts
            readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: kaneo-workflow-scripts
            defaultMode: 0555
