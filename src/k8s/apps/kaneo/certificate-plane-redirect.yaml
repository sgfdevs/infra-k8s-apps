apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: plane-redirect-tls
spec:
  secretName: plane-redirect-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
  dnsNames:
    - plane.sgf.dev
