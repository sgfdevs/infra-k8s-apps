apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaneo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: kaneo
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SECRET
      remoteRef:
        key: kaneo/app
        property: authSecret
    - secretKey: CUSTOM_OAUTH_CLIENT_ID
      remoteRef:
        key: kaneo/oidc
        property: clientId
    - secretKey: CUSTOM_OAUTH_CLIENT_SECRET
      remoteRef:
        key: kaneo/oidc
        property: clientSecret
    - secretKey: CUSTOM_OAUTH_DISCOVERY_URL
      remoteRef:
        key: kaneo/oidc
        property: discoveryUrl
