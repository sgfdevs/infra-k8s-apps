apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaneo
  labels:
    app.kubernetes.io/name: kaneo
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kaneo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaneo
    spec:
      serviceAccountName: kaneo-secrets
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kaneo
              topologyKey: kubernetes.io/hostname
      containers:
        - name: kaneo
          image: ghcr.io/usekaneo/kaneo:2.48.0@sha256:e52b4d48bb5efd5cd9a113ce47ed49ea1fb9e9c1517fd73ea4dc1c7037666def
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: runtime
              mountPath: /var/lib/kaneo
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          envFrom:
            - secretRef:
                name: kaneo
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kaneo-db-app
                  key: uri
            - name: REDIS_SENTINELS
              value: >-
                kaneo-redis-sentinel-0.kaneo-redis-sentinel-headless.kaneo.svc.cluster.local:26379,
                kaneo-redis-sentinel-1.kaneo-redis-sentinel-headless.kaneo.svc.cluster.local:26379,
                kaneo-redis-sentinel-2.kaneo-redis-sentinel-headless.kaneo.svc.cluster.local:26379
            - name: REDIS_SENTINEL_MASTER_NAME
              value: kaneo-redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kaneo-redis-account-default
                  key: password
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kaneo-redis-sentinel-account-default
                  key: password
            - name: KANEO_CLIENT_URL
              value: https://projects.sgf.dev
            - name: CORS_ORIGINS
              value: https://projects.sgf.dev
            - name: SMTP_HOST
              value: email-smtp.us-east-2.amazonaws.com
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_SECURE
              value: "false"
            - name: SMTP_REQUIRE_TLS
              value: "true"
            - name: SMTP_FROM
              value: Kaneo <projects@sgf.dev>
            - name: CUSTOM_OAUTH_SCOPES
              value: openid,profile,email
            - name: CUSTOM_AUTH_PKCE
              value: "true"
            - name: CUSTOM_OAUTH_AUTO_LOGIN
              value: "true"
            - name: DISABLE_GUEST_ACCESS
              value: "true"
            - name: DISABLE_PASSWORD_REGISTRATION
              value: "true"
            - name: DISABLE_EMAIL_OTP_SIGN_IN
              value: "true"
            - name: DISABLE_LOGIN_FORM
              value: "false"
            - name: S3_ENDPOINT
              value: https://s3.us-east-2.amazonaws.com
            - name: S3_BUCKET
              value: sgfdevs-kaneo-assets
            - name: S3_REGION
              value: us-east-2
            - name: S3_FORCE_PATH_STYLE
              value: "false"
            - name: S3_MAX_IMAGE_UPLOAD_BYTES
              value: "10485760"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
