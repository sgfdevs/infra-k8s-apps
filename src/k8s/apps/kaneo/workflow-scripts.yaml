apiVersion: v1
kind: ConfigMap
metadata:
  name: kaneo-workflow-scripts
data:
  common.sh: |
    #!/bin/sh
    set -eu

    app_state() {
      kubectl -n argocd get application kaneo -o json
    }
    ensure_idle() {
      kubectl get backups.k8up.io -o json | jq -e '
        all(.items[]; any(.status.conditions[]?; .type == "Completed" and .status == "True"))' >/dev/null
      # A failed workflow can finish before its database-writing pod terminates.
      kubectl get pods -l backup.sgf.dev/writer=kaneo -o json | jq -e '
        all(.items[]; .status.phase == "Succeeded" or .status.phase == "Failed")' >/dev/null
    }
    ensure_ready() {
      ensure_idle
      APP_STATE=$(app_state)
      printf '%s' "$APP_STATE" | jq -e '
        .metadata.annotations["restore.sgf.dev/managed"] == null and
        .metadata.annotations["restore.sgf.dev/owner"] == null and
        .metadata.annotations["argocd.argoproj.io/skip-reconcile"] == null and
        .spec.syncPolicy.automated.selfHeal == true and
        .status.operationState.phase != "Running" and .operation == null' >/dev/null
      kubectl get deployment kaneo -o json | jq -e '
        .metadata.annotations["restore.sgf.dev/original-replicas"] == null and
        .metadata.annotations["restore.sgf.dev/owner"] == null' >/dev/null
    }
    ensure_owned() {
      APP_STATE=$(app_state)
      printf '%s' "$APP_STATE" | jq -e --arg owner "$WORKFLOW_OWNER" '
        .metadata.annotations["restore.sgf.dev/managed"] == "true" and
        .metadata.annotations["restore.sgf.dev/owner"] == $owner and
        .metadata.annotations["argocd.argoproj.io/skip-reconcile"] == "true" and
        .spec.syncPolicy.automated.selfHeal == false and
        .status.operationState.phase != "Running" and .operation == null' >/dev/null
    }
    release_application() {
      ensure_owned
      patch=$(printf '%s' "$APP_STATE" | jq '{
        metadata: {resourceVersion: .metadata.resourceVersion, annotations: {
          "restore.sgf.dev/managed": null, "restore.sgf.dev/owner": null,
          "argocd.argoproj.io/skip-reconcile": null}},
        spec: {syncPolicy: {automated: {selfHeal: true}}}}')
      kubectl -n argocd patch application kaneo --type=merge -p "$patch"
    }

  wait-backup.sh: |
    #!/bin/sh
    set -eu
    kubectl wait --for=condition=Completed "backups.k8up.io/$BACKUP_NAME" --timeout=3500s
    kubectl get "backups.k8up.io/$BACKUP_NAME" -o json | jq -e '
      any(.status.conditions[]?; .type == "Completed" and .status == "True" and
        .reason == "Succeeded" and ((.message // "" | ascii_downcase | contains("nothing to backup")) | not)) and
      any(.status.conditions[]?; .type == "PreBackupPodReady" and .status == "True" and
        .reason != "NoPreBackupPodsFound")' >/dev/null

  validate-restore.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    test "$CONFIRMATION" = 'RESTORE kaneo' || {
      echo 'Confirmation must exactly match: RESTORE kaneo' >&2
      exit 1
    }
    if [ "$SNAPSHOT_ID" != latest ]; then
      case "$SNAPSHOT_ID" in
        ""|*[!0-9a-f]*) echo 'Snapshot ID must be latest or lowercase hexadecimal.' >&2; exit 1 ;;
      esac
      test "${#SNAPSHOT_ID}" -ge 8 && test "${#SNAPSHOT_ID}" -le 64
    fi
    ensure_ready

  download-restore.sh: |
    #!/bin/sh
    set -eu
    snapshot_path=/kaneo-backup.dump
    if [ "$SNAPSHOT_ID" = latest ]; then
      SNAPSHOT_ID=$(restic snapshots --json --latest 1 --group-by '' --path "$snapshot_path" |
        sed -n 's/.*"id":"\([0-9a-f]*\)".*/\1/p')
      test "${#SNAPSHOT_ID}" -eq 64 || {
        echo 'No Kaneo database snapshot was found.' >&2
        exit 1
      }
    fi
    restic dump "$SNAPSHOT_ID" "$snapshot_path" > /restore/kaneo.dump
    test -s /restore/kaneo.dump

  pause-restore.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    ensure_ready
    version=$(printf '%s' "$APP_STATE" | jq -r '.metadata.resourceVersion')
    patch=$(jq -n --arg version "$version" --arg owner "$WORKFLOW_OWNER" '{
      metadata: {resourceVersion: $version, annotations: {
        "restore.sgf.dev/managed": "true", "restore.sgf.dev/owner": $owner,
        "argocd.argoproj.io/skip-reconcile": "true"}},
      spec: {syncPolicy: {automated: {selfHeal: false}}}}')
    kubectl -n argocd patch application kaneo --type=merge -p "$patch"
    deployment=$(kubectl get deployment kaneo -o json)
    printf '%s' "$deployment" | jq -e '
      .metadata.annotations["restore.sgf.dev/original-replicas"] == null and
      .metadata.annotations["restore.sgf.dev/owner"] == null' >/dev/null
    patch=$(printf '%s' "$deployment" | jq --arg owner "$WORKFLOW_OWNER" '{
      metadata: {resourceVersion: .metadata.resourceVersion, annotations: {
        "restore.sgf.dev/original-replicas": (.spec.replicas | tostring), "restore.sgf.dev/owner": $owner}},
      spec: {replicas: 0}}')
    kubectl patch deployment kaneo --type=merge -p "$patch"
    if [ -n "$(kubectl get pods -l app.kubernetes.io/name=kaneo -o name)" ]; then
      kubectl wait --for=delete pod -l app.kubernetes.io/name=kaneo --timeout=240s
    fi

  verify-paused.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    ensure_idle
    ensure_owned
    kubectl get deployment kaneo -o json | jq -e --arg owner "$WORKFLOW_OWNER" '
      .spec.replicas == 0 and .metadata.annotations["restore.sgf.dev/owner"] == $owner' >/dev/null
    test -z "$(kubectl get pods -l app.kubernetes.io/name=kaneo -o name)"

  restore-database.sh: |
    #!/bin/sh
    set -eu
    test -s /restore/kaneo.dump
    pg_restore --list /restore/kaneo.dump >/dev/null
    psql --set=ON_ERROR_STOP=1 <<'SQL'
    SELECT pg_terminate_backend(pid)
    FROM pg_stat_activity
    WHERE datname = current_database()
      AND usename = current_user
      AND pid <> pg_backend_pid();
    SQL
    pg_restore --clean --if-exists --single-transaction --exit-on-error --no-owner --no-privileges --dbname=kaneo /restore/kaneo.dump
    table_count=$(psql --tuples-only --no-align --command="SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname = 'public';")
    test "$table_count" -gt 0 || {
      echo 'Restored database contains no public tables.' >&2
      exit 1
    }
    psql --set=ON_ERROR_STOP=1 --command='ANALYZE' >/dev/null
    echo "Kaneo database restored with $table_count public tables."

  reset-redis.sh: |
    #!/bin/sh
    set -eu
    # Redis is Kaneo's disposable cache/queue, not part of the database snapshot.
    primary=$(REDISCLI_AUTH="$SENTINEL_PASSWORD" redis-cli --raw \
      -h kaneo-redis-sentinel-redis-sentinel -p 26379 \
      SENTINEL get-master-addr-by-name kaneo-redis)
    host=$(printf '%s\n' "$primary" | sed -n '1p')
    port=$(printf '%s\n' "$primary" | sed -n '2p')
    test -n "$host"
    case "$port" in ""|*[!0-9]*) exit 1 ;; esac
    test "$port" -ge 1 && test "$port" -le 65535
    REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --raw -h "$host" -p "$port" FLUSHDB | grep -qx OK

  cleanup-restore.sh: |
    #!/bin/sh
    set -eu
    if [ "$WORKFLOW_STATUS" != Succeeded ]; then
      echo 'Restore did not succeed. Leave Kaneo paused if recovery started; inspect before running kaneo-restore-resume.' >&2
      exit 0
    fi
    /scripts/resume.sh

  resume.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    ensure_idle
    ensure_owned
    deployment=$(kubectl get deployment kaneo -o json)
    if [ "${ALLOW_UNCLAIMED_DEPLOYMENT:-false}" = true ] && printf '%s' "$deployment" | jq -e '
      .metadata.annotations["restore.sgf.dev/owner"] == null and
      .metadata.annotations["restore.sgf.dev/original-replicas"] == null' >/dev/null; then
      # The pause failed before claiming the Deployment, or a prior resume already
      # restored it and cleared its annotations before releasing the Application.
      kubectl rollout status deployment kaneo --timeout=300s
      release_application
      exit 0
    fi
    printf '%s' "$deployment" | jq -e --arg owner "$WORKFLOW_OWNER" '
      .metadata.annotations["restore.sgf.dev/owner"] == $owner' >/dev/null
    original=$(printf '%s' "$deployment" | jq -r '.metadata.annotations["restore.sgf.dev/original-replicas"] // ""')
    case "$original" in ""|*[!0-9]*) echo 'Missing or invalid saved replica count.' >&2; exit 1 ;; esac
    kubectl scale deployment kaneo --replicas="$original"
    kubectl rollout status deployment kaneo --timeout=300s
    ensure_owned
    deployment=$(kubectl get deployment kaneo -o json)
    printf '%s' "$deployment" | jq -e --arg owner "$WORKFLOW_OWNER" '
      .metadata.annotations["restore.sgf.dev/owner"] == $owner' >/dev/null
    patch=$(printf '%s' "$deployment" | jq '{metadata: {
      resourceVersion: .metadata.resourceVersion, annotations: {
        "restore.sgf.dev/original-replicas": null, "restore.sgf.dev/owner": null}}}')
    kubectl patch deployment kaneo --type=merge -p "$patch"
    release_application

  manual-resume.sh: |
    #!/bin/sh
    set -eu
    . /scripts/common.sh
    test "$CONFIRMATION" = 'RESUME kaneo' || {
      echo 'Confirmation must exactly match: RESUME kaneo' >&2
      exit 1
    }
    # Explicit acknowledgement permits recovery of an earlier workflow's saved state.
    WORKFLOW_OWNER=$(app_state | jq -er '.metadata.annotations["restore.sgf.dev/owner"] | select(length > 0)')
    ALLOW_UNCLAIMED_DEPLOYMENT=true
    export WORKFLOW_OWNER ALLOW_UNCLAIMED_DEPLOYMENT
    /scripts/resume.sh
