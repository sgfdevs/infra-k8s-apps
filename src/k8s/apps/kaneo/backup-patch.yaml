- op: replace
  path: /metadata/name
  value: kaneo-backup
- op: replace
  path: /metadata/labels/backup.k8up.io~1app
  value: kaneo
- op: replace
  path: /spec/fileExtension
  value: .dump
- op: replace
  path: /spec/backupCommand
  value: >-
    sh -ec 'pg_dump
    --host=kaneo-db-rw
    --username=kaneo
    --dbname=kaneo
    --format=custom
    --no-owner
    --no-privileges'
- op: replace
  path: /spec/pod/spec/serviceAccountName
  value: kaneo-backup
- op: add
  path: /spec/pod/spec/automountServiceAccountToken
  value: false
- op: replace
  path: /spec/pod/spec/containers/0/image
  value: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
- op: replace
  path: /spec/pod/spec/containers/0/resources/requests/memory
  value: 64Mi
- op: add
  path: /spec/pod/spec/containers/0/env
  value:
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: kaneo-db-app
          key: password
    - name: PGSSLMODE
      value: require
