apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kaneo
resources:
  - ../../platform/services/backup-base
  - namespace.yaml
  - service-account.yaml
  - secret-store.yaml
  - external-secret.yaml
  - database.yaml
  - redis.yaml
  - redis-pdb.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - middleware-https-redirect.yaml
  - certificate.yaml
  - ingress.yaml
  - middleware-plane-redirect.yaml
  - certificate-plane-redirect.yaml
  - ingressroute-plane-redirect.yaml
  - backup-secrets.yaml
  - backup-workflowtemplate.yaml
  - backup-cronworkflow.yaml
  - restore-workflowtemplate.yaml
  - restore-resume-workflowtemplate.yaml
  - workflow-scripts.yaml
  - workflow-rbac.yaml
patches:
  - path: backup-patch.yaml
    target:
      group: k8up.io
      version: v1
      kind: PreBackupPod
      name: app-backup
  - path: schedule-patch.yaml
    target:
      group: k8up.io
      version: v1
      kind: Schedule
      name: app-backup
labels:
  - pairs:
      app.kubernetes.io/part-of: kaneo
