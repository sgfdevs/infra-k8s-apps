apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kaneo
resources:
  - namespace.yaml
  - service-account.yaml
  - secret-store.yaml
  - external-secret.yaml
  - database.yaml
  - redis.yaml
  - redis-pdb.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - middleware-https-redirect.yaml
  - certificate.yaml
  - ingress.yaml
  - middleware-plane-redirect.yaml
  - certificate-plane-redirect.yaml
  - ingressroute-plane-redirect.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: kaneo
