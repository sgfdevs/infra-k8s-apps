apiVersion: apps/v1
kind: Deployment
metadata:
  name: wekan
  labels:
    app.kubernetes.io/name: wekan
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: wekan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wekan
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: wekan
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: wekan
      initContainers:
        - name: configure-storage
          image: percona/percona-server-mongodb:7.0.37-20
          imagePullPolicy: IfNotPresent
          command:
            - mongosh
          args:
            - $(MONGO_URL)
            - --tls
            - --tlsCAFile
            - /etc/mongodb-tls/ca.crt
            - --file
            - /scripts/configure-storage.js
          env:
            - name: HOME
              value: /tmp
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: wekan-mongodb-custom-user-secret-conn-str
                  key: wekan_rs0_connectionString
            - name: S3_ENDPOINT
              value: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
            - name: S3_REGION
              value: us-east-1
            - name: S3_BUCKET
              value: wekan-files
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: wekan-s3-credentials
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wekan-s3-credentials
                  key: S3_SECRET_KEY
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: storage-bootstrap
              mountPath: /scripts
              readOnly: true
            - name: mongodb-tls
              mountPath: /etc/mongodb-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: wekan
          image: ghcr.io/wekan/wekan:v11.39
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ROOT_URL
              value: https://projects.sgf.dev
            - name: PORT
              value: "8080"
            - name: WRITABLE_PATH
              value: /data
            - name: DDP_TRANSPORT
              value: sockjs
            - name: METEOR_REACTIVITY_ORDER
              value: changeStreams,polling
            - name: S3_ENABLED
              value: "true"
            - name: S3_ENDPOINT
              value: http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
            - name: S3_REGION
              value: us-east-1
            - name: S3_BUCKET
              value: wekan-files
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: wekan-s3-credentials
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wekan-s3-credentials
                  key: S3_SECRET_KEY
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: wekan-mongodb-custom-user-secret-conn-str
                  key: wekan_rs0_connectionString
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/mongodb-tls/ca.crt
            - name: OAUTH2_ENABLED
              value: "true"
            - name: OAUTH2_LOGIN_STYLE
              value: redirect
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wekan-oidc
                  key: OAUTH2_CLIENT_ID
            - name: OAUTH2_SECRET
              valueFrom:
                secretKeyRef:
                  name: wekan-oidc
                  key: OAUTH2_SECRET
            - name: OAUTH2_SERVER_URL
              value: https://id.sgf.dev
            - name: OAUTH2_AUTH_ENDPOINT
              value: /oauth/v2/authorize
            - name: OAUTH2_USERINFO_ENDPOINT
              value: /oidc/v1/userinfo
            - name: OAUTH2_TOKEN_ENDPOINT
              value: /oauth/v2/token
            - name: OAUTH2_LOGOUT_ENDPOINT
              value: /oidc/v1/end_session
            - name: OAUTH2_ID_MAP
              value: sub
            - name: OAUTH2_USERNAME_MAP
              value: preferred_username
            - name: OAUTH2_FULLNAME_MAP
              value: name
            - name: OAUTH2_EMAIL_MAP
              value: email
            - name: OAUTH2_REQUEST_PERMISSIONS
              value: openid profile email
            - name: OAUTH2_AUTO_REGISTRATION
              value: "true"
            - name: DEFAULT_AUTHENTICATION_METHOD
              value: oauth2
            - name: PASSWORD_LOGIN_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: mongodb-tls
              mountPath: /etc/mongodb-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: storage-bootstrap
          configMap:
            name: wekan-storage-bootstrap
        - name: data
          persistentVolumeClaim:
            claimName: wekan-data
        - name: mongodb-tls
          secret:
            secretName: wekan-mongodb-ssl
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
