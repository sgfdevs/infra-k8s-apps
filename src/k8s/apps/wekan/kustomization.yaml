apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wekan
resources:
  - namespace.yaml
  - service-account.yaml
  - secret-store.yaml
  - external-secrets.yaml
  - mongodb.yaml
  - pvc.yaml
  - deployment.yaml
  - pdb.yaml
  - service.yaml
  - certificate.yaml
  - middleware-https-redirect.yaml
  - ingress.yaml
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: wekan
