apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wekan-mongodb-client
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: wekan-mongodb-client
  commonName: wekan
  usages:
    - client auth
  additionalOutputFormats:
    - type: CombinedPEM
  issuerRef:
    name: wekan-mongodb-psmdb-issuer
    kind: Issuer
    group: cert-manager.io
