apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthiermo-k8up-repo-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: healthiermo-k8up-repo-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: healthiermo/backup
        property: resticPassword
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthiermo-backup-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: k8up-b2-credentials
    creationPolicy: Owner
  data:
    - secretKey: account-id
      remoteRef:
        key: /vm-workloads/sgfdevs/infra-vm-workloads/backups/b2-account-id
    - secretKey: account-key
      remoteRef:
        key: /vm-workloads/sgfdevs/infra-vm-workloads/backups/b2-account-key
