apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: healthiermo-restore-resume
spec:
  entrypoint: resume
  serviceAccountName: healthiermo-restore-workflow
  synchronization:
    mutexes:
      - name: healthiermo-maintenance
  arguments:
    parameters:
      - name: confirmation
        description: Enter "RESUME healthiermo" after inspecting a failed restore.
  activeDeadlineSeconds: 600
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 10m
  templates:
    - name: resume
      container:
        image: alpine/k8s:1.36.2
        command: [sh, -ec]
        args:
          - |
            application=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
            if [ "$CONFIRMATION" != "RESUME $application" ]; then
              echo "Confirmation must exactly match: RESUME $application" >&2
              exit 1
            fi
            /scripts/cleanup-restore.sh
        env:
          - name: CONFIRMATION
            value: "{{workflow.parameters.confirmation}}"
          - name: WORKFLOW_STATUS
            value: Succeeded
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: healthiermo-workflow-scripts
            defaultMode: 0555
