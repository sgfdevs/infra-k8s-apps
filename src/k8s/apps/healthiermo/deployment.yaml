apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthiermo
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: healthiermo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthiermo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/open-sgf/healthiermo:1.2.3@sha256:e26a0576a610df10e1d174aec02ba45a21bf488a48a724f00fa554e85d29938a
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: APP_PUBLIC_DATA_ROOT
              value: /data
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 30s
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: healthiermo-database
                  key: DB
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://healthiermo-mysql-mysql:3306/$(MYSQL_DATABASE)?sslMode=PREFERRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: healthiermo-database
                  key: USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthiermo-database
                  key: PASSWORD
          startupProbe:
            httpGet:
              path: /index
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /index
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            # This route queries text_box, unlike the static index page.
            httpGet:
              path: /text
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          volumeMounts:
            - name: audio
              mountPath: /data/audio-files
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: audio
          persistentVolumeClaim:
            claimName: healthiermo-audio
        - name: tmp
          emptyDir: {}
