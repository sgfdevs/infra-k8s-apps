apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: healthiermo-audio
  annotations:
    # Included in the logical database + audio archive, not backed up separately.
    k8up.io/backup: "false"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
