apiVersion: apps/v1
kind: Deployment
metadata:
  name: gooddads-enrollment-bot
  labels:
    app.kubernetes.io/name: gooddads-enrollment-bot
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gooddads-enrollment-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gooddads-enrollment-bot
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: runtime-directories
          # Deliberately unusable base reference; staging must pin a published image.
          image: ghcr.io/open-sgf/gooddads-enrollment-bot:unpublished
          command:
            - sh
            - -ec
            - |
              mkdir -p /runtime/framework/cache/data /runtime/framework/sessions \
                /runtime/framework/views /runtime/logs /runtime/bootstrap-cache
              cp -R /var/www/html/bootstrap/cache/. /runtime/bootstrap-cache/
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: runtime
              mountPath: /runtime
      containers:
        - name: app
          image: ghcr.io/open-sgf/gooddads-enrollment-bot:unpublished
          imagePullPolicy: IfNotPresent
          workingDir: /var/www/html
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: gooddads-enrollment-bot
            - secretRef:
                name: gooddads-enrollment-bot-application
            - secretRef:
                name: gooddads-enrollment-bot-ses
          env:
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: gooddads-enrollment-bot-database
                  key: DB
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gooddads-enrollment-bot-database
                  key: USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gooddads-enrollment-bot-database
                  key: PASSWORD
          startupProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/healthcheck
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: runtime
              mountPath: /var/www/html/bootstrap/cache
              subPath: bootstrap-cache
            - name: runtime
              mountPath: /var/www/html/storage/framework
              subPath: framework
            - name: runtime
              mountPath: /var/www/html/storage/logs
              subPath: logs
            # Do not mount storage/ itself: it contains the bundled intake-form PDF.
            - name: documents
              mountPath: /var/www/html/storage/app/private
      volumes:
        - name: tmp
          emptyDir: {}
        - name: runtime
          emptyDir: {}
        - name: documents
          persistentVolumeClaim:
            claimName: gooddads-enrollment-bot-documents
