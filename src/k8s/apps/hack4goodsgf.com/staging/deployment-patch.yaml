apiVersion: apps/v1
kind: Deployment
metadata:
  name: hack4goodsgf
spec:
  template:
    spec:
      containers:
        - name: wordpress
          env:
            - name: WORDPRESS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hack4goodsgf-redis-account-default
                  key: password
          volumeMounts:
            - name: robots
              mountPath: /var/www/html/robots.txt
              subPath: robots.txt
              readOnly: true
      volumes:
        - name: robots
          configMap:
            name: hack4goodsgf-robots
