apiVersion: apps/v1
kind: Deployment
metadata:
  name: hack4goodsgf
  labels:
    app.kubernetes.io/name: hack4goodsgf
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hack4goodsgf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hack4goodsgf
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
        fsGroup: 33
      initContainers:
        - name: wordpress-files
          image: ghcr.io/sgfdevs/hack4goodsgf.com:1.2.4
          command:
            - sh
            - -ec
            - |
              find /usr/src/wordpress -mindepth 1 -maxdepth 1 ! -name wp-content \
                -exec cp -R -t /var/www/html {} +

              for source in /usr/src/wordpress/wp-content/*; do
                target="/content/${source##*/}"
                if [ ! -e "$target" ]; then
                  cp -R "$source" "$target"
                fi
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: wordpress
              mountPath: /var/www/html
            - name: content
              mountPath: /content
      containers:
        - name: wordpress
          image: ghcr.io/sgfdevs/hack4goodsgf.com:1.2.4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hack4goodsgf
            - secretRef:
                name: hack4goodsgf-smtp
          env:
            - name: APACHE_RUN_DIR
              value: /tmp/apache2
            - name: APACHE_PID_FILE
              value: /tmp/apache2/apache2.pid
            - name: APACHE_LOCK_DIR
              value: /tmp/apache2-lock
            - name: WP_CLI_CACHE_DIR
              value: /tmp/wp-cli-cache
            - name: WORDPRESS_DB_HOST
              value: hack4goodsgf-mysql-mysql:3306
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: hack4goodsgf-wordpress-database
                  key: DB
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: hack4goodsgf-wordpress-database
                  key: USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hack4goodsgf-wordpress-database
                  key: PASSWORD
            - name: WORDPRESS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hack4goodsgf-valkey-auth
                  key: password
          startupProbe:
            httpGet:
              path: /healthz.html
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 150
          livenessProbe:
            httpGet:
              path: /healthz.html
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz.html
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: wordpress
              mountPath: /var/www/html
            - name: content
              mountPath: /var/www/html/wp-content
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: wordpress
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: content
          persistentVolumeClaim:
            claimName: hack4goodsgf-content
