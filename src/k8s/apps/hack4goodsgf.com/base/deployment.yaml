apiVersion: apps/v1
kind: Deployment
metadata:
  name: hack4goodsgf
  labels:
    app.kubernetes.io/name: hack4goodsgf
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hack4goodsgf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hack4goodsgf
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: wordpress
          image: ghcr.io/sgfdevs/hack4goodsgf.com:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hack4goodsgf
            - secretRef:
                name: hack4goodsgf-smtp
          env:
            - name: WORDPRESS_DB_HOST
              value: hack4goodsgf-mysql-mysql:3306
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: hack4goodsgf-wordpress-database
                  key: DB
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: hack4goodsgf-wordpress-database
                  key: USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hack4goodsgf-wordpress-database
                  key: PASSWORD
            - name: WORDPRESS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hack4goodsgf-valkey-auth
                  key: password
          startupProbe:
            httpGet:
              path: /healthz.html
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 150
          livenessProbe:
            httpGet:
              path: /healthz.html
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz.html
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: hack4goodsgf-content
