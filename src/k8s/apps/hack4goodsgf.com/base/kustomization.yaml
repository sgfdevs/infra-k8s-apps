apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-account.yaml
  - secret-store.yaml
  - external-secret.yaml
  - wordpress-admin-external-secret.yaml
  - wordpress-bootstrap-job.yaml
  - migration-workflowtemplate.yaml
  - migration-rbac.yaml
  - mysql-cluster.yaml
  - database.yaml
  - valkey.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - middleware-https-redirect.yaml
  - certificate.yaml
  - ingress.yaml
configMapGenerator:
  - name: hack4goodsgf-migration-scripts
    options:
      disableNameSuffixHash: true
    files:
      - migration-control.sh
      - migration-wordpress.sh
      - migration-mysql.sh
