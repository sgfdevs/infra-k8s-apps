apiVersion: v1
kind: ServiceAccount
metadata:
  name: hack4goodsgf-migration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hack4goodsgf-migration
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [hack4goodsgf]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [hack4goodsgf]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    resourceNames: [hack4goodsgf-migration]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods/exec]
    resourceNames: [hack4goodsgf-migration]
    verbs: [get, create]
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hack4goodsgf-migration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hack4goodsgf-migration
subjects:
  - kind: ServiceAccount
    name: hack4goodsgf-migration
    namespace: hack4goodsgf-com-staging
  - kind: ServiceAccount
    name: hack4goodsgf-migration
    namespace: hack4goodsgf-com-production
