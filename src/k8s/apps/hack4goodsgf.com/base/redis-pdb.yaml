apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hack4goodsgf-redis
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/instance: hack4goodsgf
      apps.kubeblocks.io/component-name: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hack4goodsgf-redis-sentinel
spec:
  minAvailable: 2
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/instance: hack4goodsgf
      apps.kubeblocks.io/component-name: redis-sentinel
