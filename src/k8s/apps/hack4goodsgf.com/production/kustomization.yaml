apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hack4goodsgf-com-production
resources:
  - ../base
  - namespace.yaml
  - db-instance.yaml
  - apex-ingress.yaml
  - middleware-www-redirect.yaml
transformers:
  - db-instance-namespace-patch.yaml
labels:
  - pairs:
      app.kubernetes.io/instance: production
    includeSelectors: true
images:
  - name: ghcr.io/sgfdevs/hack4goodsgf.com
    newTag: 1.2.4
patches:
  # Certificate provisioning is deferred until the DNS cutover.
  - patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: hack4goodsgf-tls
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: hack4goodsgf
      data:
        WORDPRESS_HOME: https://www.hack4goodsgf.com
        WORDPRESS_SITEURL: https://www.hack4goodsgf.com
        WORDPRESS_SMTP_FROM_EMAIL: hack4good@sgf.dev
  - patch: |-
      apiVersion: kinda.rocks/v1beta1
      kind: Database
      metadata:
        name: wordpress
      spec:
        instance: hack4goodsgf-production-mysql
        deletionProtected: true
  - patch: |-
      apiVersion: apps.kubeblocks.io/v1
      kind: Cluster
      metadata:
        name: hack4goodsgf-mysql
      spec:
        terminationPolicy: DoNotTerminate
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: hack4goodsgf-content
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: hack4goodsgf
  - target:
      kind: SecretStore
      name: openbao
    patch: |-
      - op: replace
        path: /spec/provider/vault/auth/kubernetes/role
        value: hack4goodsgf-production
  - target:
      kind: ExternalSecret
      name: hack4goodsgf-smtp
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: hack4goodsgf/production/ses
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: hack4goodsgf/production/ses
  - target:
      kind: ExternalSecret
      name: hack4goodsgf-wordpress-admin
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: hack4goodsgf/production/wordpress-admin
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: hack4goodsgf/production/wordpress-admin
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: hack4goodsgf/production/wordpress-admin
