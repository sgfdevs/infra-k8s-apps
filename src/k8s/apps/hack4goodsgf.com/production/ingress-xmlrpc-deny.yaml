apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hack4goodsgf-xmlrpc-deny
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: hack4goodsgf-com-production-hack4goodsgf-xmlrpc-deny@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hack4goodsgf.com
        - www.hack4goodsgf.com
      secretName: hack4goodsgf-tls
  rules:
    - host: hack4goodsgf.com
      http:
        paths:
          - path: /xmlrpc.php
            pathType: Prefix
            backend:
              service:
                name: hack4goodsgf
                port:
                  number: 80
    - host: www.hack4goodsgf.com
      http:
        paths:
          - path: /xmlrpc.php
            pathType: Prefix
            backend:
              service:
                name: hack4goodsgf
                port:
                  number: 80
