apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: owncloud-tls
spec:
  secretName: owncloud-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
  dnsNames:
    - cloud.sgf.dev
    - office.sgf.dev
