apiVersion: apps/v1
kind: Deployment
metadata:
  name: owncloud
  annotations:
    secret.reloader.stakater.com/reload: owncloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: owncloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owncloud
      annotations:
        eks.amazonaws.com/skip-containers: initialize,owncloud,collaboration
    spec:
      serviceAccountName: owncloud
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Native sidecar starts before initialization and stops after oCIS.
        # Only this container receives the projected AWS web-identity token.
        - name: s3-signing-proxy
          image: public.ecr.aws/aws-observability/aws-sigv4-proxy:1.13@sha256:d16d88cf00c59d14e47c5d837537349bfa96d9b750e1d7b7218156071eea9766
          restartPolicy: Always
          args:
            - --port=127.0.0.1:8080
            - --name=s3
            - --region=us-east-2
            - --host=s3.us-east-2.amazonaws.com
            - --strip=Authorization
            - --strip=X-Amz-Date
            - --strip=X-Amz-Security-Token
            - --strip=X-Amz-Content-Sha256
          env:
            - name: AWS_REGION
              value: us-east-2
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        - name: initialize
          image: owncloud/ocis:8.2.0
          command: [/bin/sh, /bootstrap/initialize.sh]
          envFrom:
            - configMapRef:
                name: owncloud-config
            - secretRef:
                name: owncloud
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/lib/ocis
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: owncloud
          image: owncloud/ocis:8.2.0
          args: [server]
          ports:
            - name: http
              containerPort: 9200
            - name: debug
              containerPort: 9205
          envFrom:
            - configMapRef:
                name: owncloud-config
            - secretRef:
                name: owncloud
          startupProbe:
            httpGet:
              path: /healthz
              port: debug
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: debug
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/lib/ocis
            - name: tmp
              mountPath: /tmp
        - name: collaboration
          image: owncloud/ocis:8.2.0
          args: [collaboration, server]
          ports:
            - name: wopi
              containerPort: 9300
            - name: collab-debug
              containerPort: 9304
          envFrom:
            - configMapRef:
                name: owncloud-config
            - secretRef:
                name: owncloud
          startupProbe:
            httpGet:
              path: /healthz
              port: collab-debug
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: collab-debug
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: collab-debug
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/lib/ocis
            - name: collaboration-tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: owncloud-state
        - name: bootstrap
          configMap:
            name: owncloud-bootstrap
        - name: tmp
          emptyDir: {}
        - name: collaboration-tmp
          emptyDir: {}
