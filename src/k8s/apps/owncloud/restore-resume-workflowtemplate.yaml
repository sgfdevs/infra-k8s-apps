apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: owncloud-restore-resume
spec:
  entrypoint: resume
  serviceAccountName: owncloud-restore-workflow
  synchronization:
    mutexes:
      - name: owncloud-maintenance
  activeDeadlineSeconds: 7200
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 10m
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: scripts
      configMap:
        name: owncloud-workflow-scripts
        defaultMode: 0555
    - name: tmp
      emptyDir: {}
  arguments:
    parameters:
      - name: confirmation
        description: 'Enter "RESUME owncloud" after inspecting a failed backup or restore.'
  templates:
    - name: resume
      container:
        image: alpine/k8s:1.36.2
        command: [/scripts/manual-resume.sh]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        env:
          - name: WORKFLOW_OWNER
            value: "{{workflow.uid}}"
          - name: HOME
            value: /tmp
          - name: CONFIRMATION
            value: "{{workflow.parameters.confirmation}}"
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
            readOnly: true
          - name: tmp
            mountPath: /tmp
