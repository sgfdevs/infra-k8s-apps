apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
  annotations:
    secret.reloader.stakater.com/reload: collabora
    ignore-check.kube-linter.io/no-read-only-root-fs: "Collabora builds document-worker jails and caches in the upstream image's writable filesystem."
    ignore-check.kube-linter.io/privilege-escalation-container: "coolforkit-caps requires file capabilities for its chroot jail; only CHOWN, FOWNER, and SYS_CHROOT are granted."
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: collabora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collabora
    spec:
      serviceAccountName: owncloud
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: proof-key
          image: alpine/openssl:3.5.8
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              if [ ! -e /proof/proof_key ]; then
                openssl genrsa -out /proof/proof_key.tmp 2048
                mv /proof/proof_key.tmp /proof/proof_key
              fi
              openssl pkey -in /proof/proof_key -check -noout
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          volumeMounts:
            - name: proof-key
              mountPath: /proof
      containers:
        - name: collabora
          image: collabora/code:26.04.4.2.1
          ports:
            - name: http
              containerPort: 9980
          env:
            - name: server_name
              value: localhost:9980
            - name: aliasgroup1
              value: http://owncloud.owncloud.svc.cluster.local:9300
            - name: username
              value: admin
            - name: password
              valueFrom:
                secretKeyRef:
                  name: collabora
                  key: password
            - name: extra_params
              value: >-
                --o:ssl.enable=false
                --o:ssl.termination=false
                --o:welcome.enable=false
                --o:net.frame_ancestors=http://localhost:9200
                --o:logging.level=warning
                --o:logging.anonymize.anonymize_user_data=true
                --o:mount_jail_tree=false
          startupProbe:
            httpGet:
              path: /hosting/discovery
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /hosting/discovery
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /hosting/capabilities
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            # coolforkit-caps uses file capabilities for its document-worker jail.
            allowPrivilegeEscalation: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, SYS_CHROOT]
          volumeMounts:
            - name: proof-key
              mountPath: /etc/coolwsd/proof_key
              subPath: proof_key
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: proof-key
          persistentVolumeClaim:
            claimName: collabora-proof-key
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
