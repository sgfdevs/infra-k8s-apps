apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: owncloud
resources:
  - namespace.yaml
  - identity.yaml
  - secrets.yaml
  - storage.yaml
  - service.yaml
  - certificate.yaml
  - middleware-https-redirect.yaml
  - ingress.yaml
  - deployment.yaml
  - collabora.yaml
configMapGenerator:
  - name: owncloud-config
    envs:
      - config.env
  - name: owncloud-bootstrap
    files:
      - proxy.yaml
      - csp.yaml
      - app-registry.yaml
      - initialize.sh
