apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: owncloud
resources:
  - ../../platform/services/backup-base
  - namespace.yaml
  - identity.yaml
  - secrets.yaml
  - storage.yaml
  - service.yaml
  - certificate.yaml
  - middleware-https-redirect.yaml
  - ingress.yaml
  - deployment.yaml
  - collabora.yaml
  - backup-cronworkflow.yaml
  - backup-workflowtemplate.yaml
  - restore-workflowtemplate.yaml
  - restore-resume-workflowtemplate.yaml
  - workflow-scripts.yaml
  - workflow-rbac.yaml
patches:
  # No database dump pod: K8up scans only the frozen local-state staging PVC.
  - patch: |
      apiVersion: k8up.io/v1
      kind: PreBackupPod
      metadata:
        name: app-backup
      $patch: delete
  - path: schedule-patch.yaml
    target:
      group: k8up.io
      version: v1
      kind: Schedule
      name: app-backup
configMapGenerator:
  - name: owncloud-config
    envs:
      - config.env
  - name: owncloud-bootstrap
    files:
      - proxy.yaml
      - csp.yaml
      - app-registry.yaml
      - initialize.sh
