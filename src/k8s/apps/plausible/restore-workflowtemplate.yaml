apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: plausible-restore
spec:
  entrypoint: restore
  onExit: cleanup
  serviceAccountName: plausible-restore-workflow
  synchronization:
    mutexes:
      - name: plausible-maintenance
  arguments:
    parameters:
      - name: snapshot-id
        value: latest
        description: PostgreSQL snapshot from the selected K8up backup run.
      - name: clickhouse-snapshot-id
        value: latest
        description: ClickHouse snapshot from the same K8up backup run.
      - name: keys-snapshot-id
        value: latest
        description: Application-key snapshot from the same K8up backup run.
      - name: confirmation
        description: Enter "RESTORE plausible" to confirm replacement of both databases.
  activeDeadlineSeconds: 3600
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 10m
  volumeClaimTemplates:
    - metadata:
        name: restore-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
  templates:
    - name: restore
      steps:
        - - name: validate
            template: validate
        - - name: download
            template: download
        - - name: pause
            template: pause
        - - name: verify-paused
            template: verify-paused
        - - name: restore-database
            template: restore-database
        - - name: restore-clickhouse
            template: restore-clickhouse
    - name: validate
      container:
        image: alpine/k8s:1.36.2
        command: [/scripts/validate-restore.sh]
        env:
          - name: SNAPSHOT_ID
            value: "{{workflow.parameters.snapshot-id}}"
          - name: CLICKHOUSE_SNAPSHOT_ID
            value: "{{workflow.parameters.clickhouse-snapshot-id}}"
          - name: KEYS_SNAPSHOT_ID
            value: "{{workflow.parameters.keys-snapshot-id}}"
          - name: CONFIRMATION
            value: "{{workflow.parameters.confirmation}}"
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: plausible-workflow-scripts
            defaultMode: 0555
    - name: download
      container:
        image: restic/restic:0.18.1
        command: [/scripts/download-restore.sh]
        env:
          - name: SNAPSHOT_ID
            value: "{{workflow.parameters.snapshot-id}}"
          - name: CLICKHOUSE_SNAPSHOT_ID
            value: "{{workflow.parameters.clickhouse-snapshot-id}}"
          - name: KEYS_SNAPSHOT_ID
            value: "{{workflow.parameters.keys-snapshot-id}}"
          - name: RESTIC_REPOSITORY
            value: s3:https://s3.us-east-005.backblazeb2.com/sgfdevs-on-prem-k3s-backups/plausible
          - name: RESTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: plausible-k8up-repo-password
                key: password
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: k8up-b2-credentials
                key: account-id
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: k8up-b2-credentials
                key: account-key
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
          - name: restore-data
            mountPath: /restore
          - name: keys
            mountPath: /keys
            readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: plausible-workflow-scripts
            defaultMode: 0555
        - name: keys
          secret:
            secretName: plausible-app
            items:
              - key: SECRET_KEY_BASE
                path: SECRET_KEY_BASE
              - key: TOTP_VAULT_KEY
                path: TOTP_VAULT_KEY
    - name: pause
      container:
        image: alpine/k8s:1.36.2
        command: [/scripts/pause-restore.sh]
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: plausible-workflow-scripts
            defaultMode: 0555
    - name: verify-paused
      container:
        image: alpine/k8s:1.36.2
        command: [/scripts/verify-paused.sh]
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: plausible-workflow-scripts
            defaultMode: 0555
    - name: restore-database
      container:
        image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
        command: [/scripts/restore-database.sh]
        env:
          - name: PGHOST
            value: plausible-db-rw
          - name: PGDATABASE
            value: plausible
          - name: PGUSER
            value: plausible
          - name: PGSSLMODE
            value: require
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: plausible-db-app
                key: password
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
          - name: restore-data
            mountPath: /restore
      volumes:
        - name: scripts
          configMap:
            name: plausible-workflow-scripts
            defaultMode: 0555
    - name: restore-clickhouse
      container:
        image: alpine/k8s:1.36.2
        command: [/scripts/restore-clickhouse.sh]
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
          - name: restore-data
            mountPath: /restore
      volumes:
        - name: scripts
          configMap:
            name: plausible-workflow-scripts
            defaultMode: 0555
    - name: cleanup
      container:
        image: alpine/k8s:1.36.2
        command: [/scripts/cleanup-restore.sh]
        env:
          - name: WORKFLOW_STATUS
            value: "{{workflow.status}}"
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: plausible-workflow-scripts
            defaultMode: 0555
