apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plausible-clickhouse
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: plausible-clickhouse
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CLICKHOUSE_PASSWORD: '{{ .clickhousePassword }}'
        CLICKHOUSE_DATABASE_URL: 'http://plausible:{{ .clickhousePassword }}@plausible-clickhouse:8123/plausible_events_db'
  data:
    - secretKey: clickhousePassword
      remoteRef:
        key: plausible/clickhouse-password
        property: clickhousePassword
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plausible-clickhouse-users
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: plausible-clickhouse-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        users.xml: |
          <clickhouse>
            <profiles>
              <default>
                <max_threads>2</max_threads>
                <max_block_size>8192</max_block_size>
                <max_download_threads>1</max_download_threads>
                <max_memory_usage>536870912</max_memory_usage>
                <input_format_parallel_parsing>0</input_format_parallel_parsing>
                <output_format_parallel_formatting>0</output_format_parallel_formatting>
                <log_queries>0</log_queries>
                <log_query_threads>0</log_query_threads>
              </default>
            </profiles>
            <users>
              <default>
                <networks replace="replace">
                  <ip>127.0.0.1</ip>
                  <ip>::1</ip>
                </networks>
              </default>
              <plausible>
                <password_sha256_hex>{{ .clickhousePassword | sha256sum }}</password_sha256_hex>
                <networks><ip>::/0</ip></networks>
                <profile>default</profile>
                <quota>default</quota>
                <access_management>0</access_management>
              </plausible>
            </users>
          </clickhouse>
  data:
    - secretKey: clickhousePassword
      remoteRef:
        key: plausible/clickhouse-password
        property: clickhousePassword
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plausible-smtp
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: plausible-smtp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SMTP_HOST_ADDR: '{{ .host }}'
        SMTP_HOST_PORT: '{{ .port }}'
        SMTP_USER_NAME: '{{ .username }}'
        SMTP_USER_PWD: '{{ .password }}'
        MAILER_EMAIL: '{{ .fromAddress }}'
  dataFrom:
    - extract:
        key: plausible/ses
---
