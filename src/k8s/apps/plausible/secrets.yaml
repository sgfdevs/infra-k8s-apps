apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plausible-secret-key-base
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: plausible-secret-key-base
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: plausible/secret-key-base
        property: secretKeyBase
---
