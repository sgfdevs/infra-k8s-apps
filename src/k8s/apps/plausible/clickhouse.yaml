apiVersion: v1
kind: Service
metadata:
  name: plausible-clickhouse
  labels:
    app.kubernetes.io/name: plausible-clickhouse
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: plausible-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plausible-clickhouse
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    secret.reloader.stakater.com/reload: plausible-app,plausible-clickhouse-users
spec:
  serviceName: plausible-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plausible-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plausible-clickhouse
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.12.6.70-alpine@sha256:cd450891db46cc6ffe313ca2b0fb7dbfb897a6873ca74a724cbe050a2cf62621
          command: [clickhouse-server]
          args: [--config-file=/etc/clickhouse-server/config.xml]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
            - name: metrics
              containerPort: 9363
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plausible-app
                  key: CLICKHOUSE_PASSWORD
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: backups
              mountPath: /var/lib/clickhouse/backups
            - name: server-config
              mountPath: /etc/clickhouse-server/config.d/plausible.xml
              subPath: server.xml
              readOnly: true
            - name: users
              mountPath: /etc/clickhouse-server/users.d/plausible.xml
              subPath: users.xml
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: backups
          emptyDir:
            sizeLimit: 1Gi
        - name: server-config
          configMap:
            name: plausible-clickhouse-config
        - name: users
          secret:
            secretName: plausible-clickhouse-users
        - name: scripts
          configMap:
            name: plausible-clickhouse-scripts
        - name: logs
          emptyDir:
            sizeLimit: 100Mi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          k8up.io/backup: "false"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
