apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: plausible-keys
  labels:
    backup.k8up.io/app: plausible
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Only ciphertext is retained remotely through the encrypted restic repository.
  backupCommand: sh -ec 'tar -czf - -C /keys SECRET_KEY_BASE TOTP_VAULT_KEY'
  fileExtension: .tar.gz
  pod:
    spec:
      serviceAccountName: plausible-backup
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 65533
        fsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          image: busybox:1.37.0
          command: [sh, -c, sleep 3600]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: plausible-app
            items:
              - key: SECRET_KEY_BASE
                path: SECRET_KEY_BASE
              - key: TOTP_VAULT_KEY
                path: TOTP_VAULT_KEY
