apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: plausible-tls
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: plausible-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
  dnsNames:
    - plausible.sgf.dev
