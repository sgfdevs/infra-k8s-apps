apiVersion: apps/v1
kind: Deployment
metadata:
  name: plausible
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    secret.reloader.stakater.com/reload: plausible-secret-key-base,plausible-totp-vault-key,plausible-clickhouse,plausible-smtp
    configmap.reloader.stakater.com/reload: plausible
spec:
  # CE analytics sessions use process-local caches. Do not scale out blindly.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plausible
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plausible
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 65533
        fsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plausible
          image: ghcr.io/plausible/community-edition:v3.2.1@sha256:33e60bfb40f2df5da00f8753b76fad04f67dba3abe6d73eb516e440e3fb62985
          command: [sh, -ec]
          args:
            - |
              mkdir -p "$TMPDIR"
              exec /entrypoint.sh run
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: plausible
            - secretRef:
                name: plausible-secret-key-base
            - secretRef:
                name: plausible-totp-vault-key
            - secretRef:
                name: plausible-clickhouse
            - secretRef:
                name: plausible-smtp
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plausible-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          # A database failover should remove readiness, not restart the app.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/plausible
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: plausible-data
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
