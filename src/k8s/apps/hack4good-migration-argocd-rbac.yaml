apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hack4goodsgf-migration
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [hack4goodsgf-com-staging, hack4goodsgf-com-production]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hack4goodsgf-migration
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hack4goodsgf-migration
subjects:
  - kind: ServiceAccount
    name: hack4goodsgf-migration
    namespace: hack4goodsgf-com-staging
  - kind: ServiceAccount
    name: hack4goodsgf-migration
    namespace: hack4goodsgf-com-production
