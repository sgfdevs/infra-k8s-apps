apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline
    spec:
      serviceAccountName: outline-secrets
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: outline
              topologyKey: kubernetes.io/hostname
      containers:
        - name: outline
          image: docker.getoutline.com/outlinewiki/outline
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /etc/outline/start.sh]
          args: [node, build/server/index.js, --no-migrate]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: outline
            - secretRef:
                name: outline
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outline-db-app
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outline-redis-account-default
                  key: password
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outline-redis-sentinel-account-default
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: start
              mountPath: /etc/outline
              readOnly: true
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: [sleep, "5"]
          startupProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          # Dependency outages should fail readiness, not restart every replica.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: start
          configMap:
            name: outline-start
        - name: tmp
          emptyDir: {}
