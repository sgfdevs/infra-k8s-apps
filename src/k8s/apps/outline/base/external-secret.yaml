apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: outline
    creationPolicy: Owner
  data:
    # Preserve the source instance's encryption and utility secrets.
    - secretKey: SECRET_KEY
      remoteRef:
        key: outline/instance/app
        property: secretKey
    - secretKey: UTILS_SECRET
      remoteRef:
        key: outline/instance/app
        property: utilsSecret
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: outline/instance/ses
        property: username
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: outline/instance/ses
        property: password
