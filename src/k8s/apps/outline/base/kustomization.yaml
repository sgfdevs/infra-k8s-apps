apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform/services/backup-base
  - identity.yaml
  - backup-serviceaccount.yaml
  - externalsecret-backup-credentials.yaml
  - external-secret.yaml
  - configmap.yaml
  - database.yaml
  - redis.yaml
  - pdb.yaml
  - migration-job.yaml
  - deployment.yaml
  - cronjobs.yaml
  - ingress.yaml
  - backup-workflowtemplate.yaml
  - restore-workflowtemplate.yaml
  - restore-resume-workflowtemplate.yaml
  - workflow-scripts.yaml
  - workflow-rbac.yaml
patches:
  - path: backup-patch.yaml
    target:
      group: k8up.io
      version: v1
      kind: PreBackupPod
      name: app-backup
  - path: schedule-patch.yaml
    target:
      group: k8up.io
      version: v1
      kind: Schedule
      name: app-backup
images:
  - name: docker.getoutline.com/outlinewiki/outline
    newTag: 1.11.0
    digest: sha256:08ee9ffdb847e1bd35ded30ee832090dd06a7f93f67422687db59e70bc7f5393
configMapGenerator:
  - name: outline-start
    files:
      - start.sh
