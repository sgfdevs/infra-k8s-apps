apiVersion: batch/v1
kind: Job
metadata:
  name: outline-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: outline-secrets
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: docker.getoutline.com/outlinewiki/outline
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /etc/outline/start.sh]
          # Use Outline's own migration lock/checks once, before rolling the app.
          args: [node, build/server/scripts/checkMigrations.js]
          envFrom:
            - configMapRef:
                name: outline
            - secretRef:
                name: outline
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outline-db-app
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outline-redis-account-default
                  key: password
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outline-redis-sentinel-account-default
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: start
              mountPath: /etc/outline
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: start
          configMap:
            name: outline-start
        - name: tmp
          emptyDir: {}
