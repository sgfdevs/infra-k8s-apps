apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: outline-opensgf
resources:
  - ../base
  - namespace.yaml
patches:
  - target:
      group: k8up.io
      version: v1
      kind: Schedule
      name: outline-backup
    patch: |-
      - op: replace
        path: /spec/backend/s3/bucket
        value: sgfdevs-on-prem-k3s-backups/outline-opensgf
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: WorkflowTemplate
      name: outline-backup
    patch: |-
      - op: replace
        path: /spec/templates/2/resource/manifest
        value: |
          apiVersion: k8up.io/v1
          kind: Backup
          metadata:
            name: {{workflow.name}}
          spec:
            activeDeadlineSeconds: 1800
            failedJobsHistoryLimit: 2
            successfulJobsHistoryLimit: 2
            tags: [outline, on-demand]
            labelSelectors:
              - matchLabels:
                  backup.k8up.io/app: outline
            backend:
              repoPasswordSecretRef:
                name: outline-k8up-repo-password
                key: password
              s3:
                endpoint: https://s3.us-east-005.backblazeb2.com
                bucket: sgfdevs-on-prem-k3s-backups/outline-opensgf
                accessKeyIDSecretRef:
                  name: k8up-b2-credentials
                  key: account-id
                secretAccessKeySecretRef:
                  name: k8up-b2-credentials
                  key: account-key
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: WorkflowTemplate
      name: outline-restore
    patch: |-
      - op: replace
        path: /spec/templates/2/container/env/1/value
        value: s3:https://s3.us-east-005.backblazeb2.com/sgfdevs-on-prem-k3s-backups/outline-opensgf
  - target:
      group: external-secrets.io
      version: v1
      kind: ExternalSecret
      name: outline-k8up-repo-password
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: outline/opensgf/backup
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: outline
      data:
        URL: https://docs.opensgf.org
        AWS_S3_UPLOAD_BUCKET_NAME: opensgf-outline-assets
        SMTP_FROM_EMAIL: Open SGF Docs <opensgf-outline@sgf.dev>
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: outline-secrets
        annotations:
          infra.sgf.dev/aws-role-arn: "arn:aws:iam::${SGFDEVS_AWS_ACCOUNT_ID}:role/sgfdevs-k3s/sgfdevs-k3s-outline-opensgf"
  - patch: |-
      apiVersion: external-secrets.io/v1
      kind: SecretStore
      metadata:
        name: openbao
      spec:
        provider:
          vault:
            auth:
              kubernetes:
                role: outline-opensgf-secrets
  - target:
      kind: ExternalSecret
      name: outline
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: outline/opensgf/secret-key
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: outline/opensgf/utils-secret
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: outline/opensgf/ses
      - op: replace
        path: /spec/data/3/remoteRef/key
        value: outline/opensgf/ses
  - patch: |-
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: outline-tls
      spec:
        dnsNames:
          - docs.opensgf.org
          - outline.opensgf.org
  - target:
      kind: Ingress
      name: outline
    patch: |-
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: outline-opensgf-outline-https-redirect@kubernetescrd,outline-opensgf-outline-canonical@kubernetescrd
      - op: replace
        path: /spec/tls/0/hosts
        value: [docs.opensgf.org, outline.opensgf.org]
      - op: replace
        path: /spec/rules/0/host
        value: docs.opensgf.org
      - op: replace
        path: /spec/rules/1/host
        value: outline.opensgf.org
  - patch: |-
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: outline-canonical
      spec:
        redirectRegex:
          regex: '^https?://outline[.]opensgf[.]org/(.*)'
          replacement: 'https://docs.opensgf.org/${1}'
