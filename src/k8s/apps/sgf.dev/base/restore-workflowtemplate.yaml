apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sgf-dev-restore
spec:
  entrypoint: restore
  serviceAccountName: sgf-dev-restore-workflow
  synchronization:
    mutexes:
      - name: sgf-dev-maintenance
  arguments:
    parameters:
      - name: snapshot-id
      - name: confirmation
  activeDeadlineSeconds: 1200
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 10m
  templates:
    - name: restore
      container:
        image: alpine:3.22.1
        command: [/scripts/restore.sh]
        env:
          - name: TARGET_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: SNAPSHOT_ID
            value: "{{workflow.parameters.snapshot-id}}"
          - name: CONFIRMATION
            value: "{{workflow.parameters.confirmation}}"
          - name: RESTIC_REPOSITORY
            value: b2:sgfdevs-on-prem-k3s-backups:$(TARGET_NAMESPACE)
          - name: RESTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: sgf-dev-k8up-repo-password
                key: password
          - name: B2_ACCOUNT_ID
            valueFrom:
              secretKeyRef:
                name: k8up-b2-credentials
                key: account-id
          - name: B2_ACCOUNT_KEY
            valueFrom:
              secretKeyRef:
                name: k8up-b2-credentials
                key: account-key
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
          - name: scripts
            mountPath: /scripts
          - name: data
            mountPath: /data
      volumes:
        - name: scripts
          configMap:
            name: sgf-dev-workflow-scripts
            defaultMode: 0555
        - name: data
          persistentVolumeClaim:
            claimName: sgf-dev-data
