apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgf-dev-writer
  labels:
    app.kubernetes.io/name: sgf-dev-writer
    app.kubernetes.io/component: writer
    app.kubernetes.io/part-of: sgf-dev
  annotations:
    # Argo must wait for this Deployment to finish migrations before updating the subscriber.
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sgf-dev-writer
      app.kubernetes.io/component: writer
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/name: sgf-dev-writer
        app.kubernetes.io/component: writer
        app.kubernetes.io/part-of: sgf-dev
    spec:
      hostname: sgf-dev-writer
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/part-of: sgf-dev
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sgf-dev
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: initialize-data
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              mkdir -p /data/umbraco/TEMP/MediaCache /data/data-protection-keys /data/pods/writer/examine
              for path in /data/umbraco /data/umbraco/TEMP/MediaCache /data/data-protection-keys /data/pods/writer/examine /temp; do
                if [ "$(stat -c '%u:%g' "$path")" != "1654:1654" ]; then
                  chown -R 1654:1654 "$path"
                fi
              done
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temp
              mountPath: /temp
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: sgf-dev
          image: ghcr.io/sgfdevs/sgf.dev:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sgf-dev
            - secretRef:
                name: sgf-dev
          env:
            - name: SGFDevs__ServerRole
              value: SchedulingPublisher
            - name: Umbraco__CMS__Hosting__MachineIdentifier
              value: sgf-dev-writer
            - name: Umbraco__CMS__Unattended__UpgradeUnattended
              value: "true"
            - name: Umbraco__CMS__Unattended__PackageMigrationsUnattended
              value: "true"
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 150
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/sgf-dev
              subPath: umbraco
            - name: data
              mountPath: /home/app/.aspnet/DataProtection-Keys
              subPath: data-protection-keys
            - name: temp
              mountPath: /usr/src/main/umbraco/Data/TEMP
            - name: data
              mountPath: /usr/src/main/umbraco/Data/TEMP/MediaCache
              subPath: umbraco/TEMP/MediaCache
            - name: data
              mountPath: /usr/src/main/umbraco/Data/TEMP/ExamineIndexes
              subPath: pods/writer/examine
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sgf-dev-data
        - name: temp
          emptyDir: {}
