apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sgf-dev-backup
spec:
  entrypoint: backup
  serviceAccountName: sgf-dev-backup-workflow
  synchronization:
    mutexes:
      - name: sgf-dev-maintenance
  activeDeadlineSeconds: 3600
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 10m
  templates:
    - name: backup
      steps:
        - - name: create
            template: create
        - - name: require-success
            template: fail
            when: "{{steps.create.outputs.parameters.reason}} != Succeeded"
            arguments:
              parameters:
                - name: reason
                  value: "{{steps.create.outputs.parameters.reason}}"

    - name: create
      resource:
        action: create
        successCondition: status.finished == true
        manifest: |
          apiVersion: k8up.io/v1
          kind: Backup
          metadata:
            name: {{workflow.name}}
          spec:
            failedJobsHistoryLimit: 2
            successfulJobsHistoryLimit: 2
            tags:
              - {{workflow.namespace}}
              - sgf-dev
              - on-demand
            labelSelectors:
              - matchLabels:
                  backup.k8up.io/app: sgf-dev
            backend:
              repoPasswordSecretRef:
                name: sgf-dev-k8up-repo-password
                key: password
              b2:
                bucket: sgfdevs-on-prem-k3s-backups
                path: {{workflow.namespace}}
                accountIDSecretRef:
                  name: k8up-b2-credentials
                  key: account-id
                accountKeySecretRef:
                  name: k8up-b2-credentials
                  key: account-key
      outputs:
        parameters:
          - name: reason
            valueFrom:
              jqFilter: '.status.conditions[] | select(.type == "Completed") | .reason'

    - name: fail
      inputs:
        parameters:
          - name: reason
      container:
        image: alpine:3.22.1
        command: [sh, -c]
        args:
          - 'echo "Backup completed with reason: $REASON" >&2; exit 1'
        env:
          - name: REASON
            value: "{{inputs.parameters.reason}}"
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 32Mi
