apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgf-dev
  labels:
    app.kubernetes.io/name: sgf-dev
    app.kubernetes.io/part-of: sgf-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sgf-dev
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        app.kubernetes.io/name: sgf-dev
        app.kubernetes.io/part-of: sgf-dev
    spec:
      hostname: sgf-dev
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: initialize-data
          image: busybox:1.37.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            readOnlyRootFilesystem: true
          command:
            - sh
            - -ec
            - |
              mkdir -p /data/umbraco/TEMP/MediaCache /data/data-protection-keys /data/examine
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: sgf-dev
          image: ghcr.io/sgfdevs/sgf.dev:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sgf-dev
            - secretRef:
                name: sgf-dev
          env:
            - name: Umbraco__CMS__Hosting__MachineIdentifier
              value: sgf-dev
            - name: Umbraco__CMS__Unattended__UpgradeUnattended
              value: "true"
            - name: Umbraco__CMS__Unattended__PackageMigrationsUnattended
              value: "true"
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 150
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/sgf-dev
              subPath: umbraco
            - name: data
              mountPath: /home/app/.aspnet/DataProtection-Keys
              subPath: data-protection-keys
            - name: temp
              mountPath: /usr/src/main/umbraco/Data/TEMP
            - name: runtime-temp
              mountPath: /tmp
            - name: data
              mountPath: /usr/src/main/umbraco/Data/TEMP/MediaCache
              subPath: umbraco/TEMP/MediaCache
            - name: data
              mountPath: /usr/src/main/umbraco/Data/TEMP/ExamineIndexes
              subPath: examine
            - name: media
              mountPath: /usr/src/main/wwwroot/media
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sgf-dev-data
        - name: temp
          emptyDir: {}
        - name: runtime-temp
          emptyDir: {}
        - name: media
          emptyDir: {}
