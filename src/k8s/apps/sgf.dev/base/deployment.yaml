apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgf-dev
  labels:
    app.kubernetes.io/name: sgf-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sgf-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sgf-dev
    spec:
      hostname: sgf-dev
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: initialize-data
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - mkdir -p /data/umbraco /data/data-protection-keys
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: sgf-dev
          image: ghcr.io/sgfdevs/sgf.dev:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sgf-dev
            - secretRef:
                name: sgf-dev
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 150
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /usr/src/main/umbraco/Data
              subPath: umbraco
            - name: data
              mountPath: /root/.aspnet/DataProtection-Keys
              subPath: data-protection-keys
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sgf-dev-data
