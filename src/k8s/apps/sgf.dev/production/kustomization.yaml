apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sgf-dev-production
resources:
  - ../base
  - namespace.yaml
labels:
  - pairs:
      app.kubernetes.io/instance: production
    includeSelectors: true
images:
  - name: ghcr.io/sgfdevs/sgf.dev
    newTag: 1.8.4
patches:
  - path: configmap-patch.yaml
  - path: deployment-patch.yaml
  - path: environment-patch.yaml
    target:
      kind: SecretStore
      name: openbao
  - path: external-secret-patch.yaml
    target:
      kind: ExternalSecret
      name: sgf-dev
  - path: certificate-patch.yaml
    target:
      kind: Certificate
      name: sgf-dev-tls
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: sgf-dev
