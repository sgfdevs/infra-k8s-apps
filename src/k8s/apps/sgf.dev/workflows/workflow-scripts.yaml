apiVersion: v1
kind: ConfigMap
metadata:
  name: sgf-dev-workflow-scripts
data:
  backup.sh: |
    #!/bin/sh
    set -eu

    wait_for_k8up() {
      resource=$1
      name=$2
      deadline=$(($(date +%s) + 3600))
      while [ "$(date +%s)" -lt "$deadline" ]; do
        reason=$(kubectl get "$resource" "$name" -n "$TARGET_NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="Completed")].reason}' 2>/dev/null || true)
        case "$reason" in
          Succeeded) return 0 ;;
          Failed)
            kubectl describe "$resource" "$name" -n "$TARGET_NAMESPACE" || true
            return 1
            ;;
        esac
        sleep 10
      done
      kubectl describe "$resource" "$name" -n "$TARGET_NAMESPACE" || true
      return 1
    }

    backup="sgf-dev-on-demand-$WORKFLOW_UID"

    cat <<EOF | kubectl create -f -
    apiVersion: k8up.io/v1
    kind: Backup
    metadata:
      name: $backup
      namespace: $TARGET_NAMESPACE
    spec:
      failedJobsHistoryLimit: 2
      successfulJobsHistoryLimit: 2
      tags:
        - $TARGET_NAMESPACE
        - sgf-dev
        - on-demand
      labelSelectors:
        - matchLabels:
            backup.k8up.io/app: sgf-dev
      backend:
        repoPasswordSecretRef:
          name: sgf-dev-k8up-repo-password
          key: password
        b2:
          bucket: sgfdevs-on-prem-k3s-backups
          path: $BACKEND_PATH
          accountIDSecretRef:
            name: k8up-b2-credentials
            key: account-id
          accountKeySecretRef:
            name: k8up-b2-credentials
            key: account-key
    EOF

    wait_for_k8up backups.k8up.io "$backup"
    echo "Backup $TARGET_NAMESPACE/$backup completed successfully."

  restore.sh: |
    #!/bin/sh
    set -eu

    wait_for_job() {
      job=$1
      deadline=$(($(date +%s) + 1200))
      while [ "$(date +%s)" -lt "$deadline" ]; do
        condition=$(kubectl get job "$job" -n "$TARGET_NAMESPACE" -o jsonpath='{.status.conditions[?(@.status=="True")].type}' 2>/dev/null || true)
        case "$condition" in
          *Complete*) return 0 ;;
          *Failed*)
            kubectl logs job/"$job" -n "$TARGET_NAMESPACE" --all-containers=true || true
            return 1
            ;;
        esac
        sleep 5
      done
      kubectl logs job/"$job" -n "$TARGET_NAMESPACE" --all-containers=true || true
      return 1
    }

    case "$SNAPSHOT_ID" in
      ""|*[!0-9a-f]*) echo "Snapshot ID must contain only lowercase hexadecimal characters." >&2; exit 1 ;;
    esac
    if [ "${#SNAPSHOT_ID}" -lt 8 ] || [ "${#SNAPSHOT_ID}" -gt 64 ]; then
      echo "Snapshot ID must be between 8 and 64 characters." >&2
      exit 1
    fi
    if [ "$CONFIRMATION" != "RESTORE $TARGET_NAMESPACE" ]; then
      echo "Confirmation must exactly match: RESTORE $TARGET_NAMESPACE" >&2
      exit 1
    fi

    for deployment in sgf-dev sgf-dev-writer; do
      replicas=$(kubectl get deployment "$deployment" -n "$TARGET_NAMESPACE" -o jsonpath='{.spec.replicas}')
      if [ "$replicas" != 0 ]; then
        echo "$TARGET_NAMESPACE/$deployment must be scaled to zero through GitOps before restore." >&2
        exit 1
      fi
    done

    pods=$(kubectl get pods -n "$TARGET_NAMESPACE" -l app.kubernetes.io/part-of=sgf-dev -o name)
    if [ -n "$pods" ]; then
      echo "Application pods still exist in $TARGET_NAMESPACE:" >&2
      echo "$pods" >&2
      exit 1
    fi

    restore_job="sgf-dev-restore-$WORKFLOW_UID"

    cat <<EOF | kubectl create -f -
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: $restore_job
      namespace: $TARGET_NAMESPACE
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1200
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: restore
              image: alpine:3.22.1
              command: [sh, -ec]
              args:
                - |
                  apk add --no-cache restic sqlite >/dev/null
                  database=/data/umbraco/Umbraco.sqlite.db
                  temporary=\$(mktemp /data/umbraco/.Umbraco.sqlite.db.restore.XXXXXX)
                  trap 'rm -f "\$temporary"' EXIT
                  restic dump "$SNAPSHOT_ID" /sgf-dev-backup.sqlite.db > "\$temporary"
                  test -s "\$temporary"
                  test "\$(sqlite3 "\$temporary" 'PRAGMA integrity_check;')" = ok
                  chown 1654:1654 "\$temporary"
                  chmod 0644 "\$temporary"
                  sync "\$temporary"
                  mv -f "\$temporary" "\$database"
                  rm -f "\$database-wal" "\$database-shm"
              env:
                - name: RESTIC_REPOSITORY
                  value: b2:sgfdevs-on-prem-k3s-backups:$BACKEND_PATH
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sgf-dev-k8up-repo-password
                      key: password
                - name: B2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: k8up-b2-credentials
                      key: account-id
                - name: B2_ACCOUNT_KEY
                  valueFrom:
                    secretKeyRef:
                      name: k8up-b2-credentials
                      key: account-key
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: sgf-dev-data
    EOF
    wait_for_job "$restore_job"
    echo "Snapshot $SNAPSHOT_ID was restored to $TARGET_NAMESPACE and passed SQLite integrity checks."
