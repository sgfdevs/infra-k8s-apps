apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sgf-dev-production-restore
spec:
  entrypoint: restore
  serviceAccountName: sgf-dev-production-restore
  synchronization:
    mutexes:
      - name: sgf-dev-production-maintenance
  arguments:
    parameters:
      - name: snapshot-id
      - name: confirmation
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 10m
  templates:
    - name: restore
      container:
        image: registry.k8s.io/kubectl:v1.36.2
        command: [/scripts/restore.sh]
        env:
          - name: TARGET_NAMESPACE
            value: sgf-dev-production
          - name: BACKEND_PATH
            value: sgf-dev-production
          - name: BACKUP_PATH
            value: /sgf-dev-production-backup.sqlite.db
          - name: WORKFLOW_UID
            value: "{{workflow.uid}}"
          - name: SNAPSHOT_ID
            value: "{{workflow.parameters.snapshot-id}}"
          - name: CONFIRMATION
            value: "{{workflow.parameters.confirmation}}"
        volumeMounts:
          - name: scripts
            mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: sgf-dev-workflow-scripts
            defaultMode: 0555
