apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: kubeblocks-manager-cpu-request.infra.sgf.dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  failurePolicy: Ignore
  reinvocationPolicy: IfNeeded
  matchConstraints:
    objectSelector:
      matchLabels:
        app.kubernetes.io/name: kubeblocks
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
  matchConditions:
    - name: has-manager-cpu-request
      expression: >-
        has(object.metadata.annotations) &&
        "infra.sgf.dev/manager-cpu-request" in object.metadata.annotations &&
        object.spec.containers.exists(c, c.name == "manager")
  # The chart couples CPU requests and limits. Override only the named Pod request.
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              containers: [Object.spec.containers{
                name: "manager",
                resources: Object.spec.containers.resources{
                  requests: {
                    "cpu": object.metadata.annotations["infra.sgf.dev/manager-cpu-request"]
                  }
                }
              }]
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: kubeblocks-manager-cpu-request.infra.sgf.dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  policyName: kubeblocks-manager-cpu-request.infra.sgf.dev
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kb-system
