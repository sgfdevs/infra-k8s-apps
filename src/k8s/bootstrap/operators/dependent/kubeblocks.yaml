apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeblocks
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    chart: kubeblocks
    repoURL: https://apecloud.github.io/helm-charts
    targetRevision: 1.0.2
    helm:
      values: |
        autoInstalledAddons:
          - mysql
        dataProtection:
          enabled: false
        storageClass:
          create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
