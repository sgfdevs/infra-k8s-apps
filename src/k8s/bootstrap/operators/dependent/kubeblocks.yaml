apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeblocks
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    chart: kubeblocks
    repoURL: https://apecloud.github.io/helm-charts
    targetRevision: 1.0.3-beta.22
    helm:
      values: |
        # The admission policy lowers requests without changing the chart's CPU limit.
        podAnnotations:
          infra.sgf.dev/manager-cpu-request: 50m
        autoInstalledAddons:
          - mysql
          - redis
        dataProtection:
          enabled: false
        storageClass:
          create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kb-system
  ignoreDifferences:
    - group: extensions.kubeblocks.io
      kind: Addon
      managedFieldsManagers:
        - kubeblocks
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
