apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    chart: db-operator
    repoURL: https://db-operator.github.io/charts
    targetRevision: 3.12.0
    helm:
      values: |
        crds:
          install: true
          keep: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: db-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
