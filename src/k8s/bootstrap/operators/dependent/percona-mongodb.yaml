apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: percona-mongodb-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    chart: psmdb-operator
    repoURL: https://percona.github.io/percona-helm-charts
    targetRevision: 1.23.0
    helm:
      skipCrds: true
      values: |
        watchAllNamespaces: true
        disableTelemetry: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        nodeSelector:
          cpu-microarchitecture: x86-64-v3
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 2
          runAsGroup: 2
          fsGroup: 2
          fsGroupChangePolicy: OnRootMismatch
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: percona-mongodb-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
