apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: loki-chunks
  namespace: observability
spec:
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  placement:
    replication: "001"
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: loki-ruler
  namespace: observability
spec:
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  placement:
    replication: "001"
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: loki-admin
  namespace: observability
spec:
  clusterRef:
    name: seaweedfs
    namespace: seaweedfs
  placement:
    replication: "001"
  reclaimPolicy: Retain
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: loki
  namespace: observability
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  name: observability-loki
  reclaimPolicy: Delete
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: loki
  namespace: observability
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  identityRef:
    name: loki
  secretRef:
    name: loki-s3-credentials
    accessKeyField: AWS_ACCESS_KEY_ID
    secretKeyField: AWS_SECRET_ACCESS_KEY
  reclaimPolicy: Delete
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: loki
  namespace: observability
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  name: observability-loki
  statements:
    - effect: Allow
      actions:
        - s3:GetBucketLocation
        - s3:ListBucket
      resources:
        - loki-chunks
        - loki-ruler
        - loki-admin
    - effect: Allow
      actions:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      resources:
        - loki-chunks/*
        - loki-ruler/*
        - loki-admin/*
  reclaimPolicy: Delete
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3PolicyBinding
metadata:
  name: loki
  namespace: observability
spec:
  seaweedRef:
    name: seaweedfs
    namespace: seaweedfs
  policyRef:
    name: loki
  subjects:
    - kind: S3Identity
      name: loki
  reclaimPolicy: Delete
