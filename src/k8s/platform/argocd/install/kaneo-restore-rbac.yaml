apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kaneo-restore-workflow
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["kaneo"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaneo-restore-workflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kaneo-restore-workflow
subjects:
  - kind: ServiceAccount
    name: kaneo-restore-workflow
    namespace: kaneo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kaneo-backup-workflow
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["kaneo"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaneo-backup-workflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kaneo-backup-workflow
subjects:
  - kind: ServiceAccount
    name: kaneo-backup-workflow
    namespace: kaneo
