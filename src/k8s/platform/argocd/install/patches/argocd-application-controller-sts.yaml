apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
  annotations:
    configmap.reloader.stakater.com/reload: argocd-cmd-params-cm
spec:
  template:
    spec:
      containers:
        - name: argocd-application-controller
          resources:
            requests:
              cpu: 200m
              memory: 1536Mi
            limits:
              memory: 4Gi
