apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
spec:
  template:
    spec:
      initContainers:
        - name: copyutil
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
      containers:
        - name: dex
          resources:
            requests:
              cpu: 5m
              memory: 128Mi
            limits:
              memory: 256Mi
