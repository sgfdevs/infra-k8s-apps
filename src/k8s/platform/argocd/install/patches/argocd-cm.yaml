apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  application.resourceTrackingMethod: annotation
  resource.customizations.ignoreDifferences.apps_Deployment: |
    jsonPointers:
      - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
  resource.customizations.ignoreDifferences.apps_StatefulSet: |
    jsonPointers:
      - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
  resource.customizations.ignoreDifferences.apps_DaemonSet: |
    jsonPointers:
      - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "Health gate disabled"
    if obj.metadata.annotations ~= nil and
       obj.metadata.annotations["infra.sgf.dev/health-gate"] == "true" then
      hs.status = "Progressing"
      hs.message = "Waiting for child application"
      if obj.status ~= nil and
         obj.status.sync ~= nil and
         obj.status.sync.status == "Synced" and
         obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    if obj.metadata.annotations ~= nil and
       obj.metadata.annotations["infra.sgf.dev/issuer-operation-gate"] == "true" then
      local op = obj.status and obj.status.operationState
      local revision = obj.status and obj.status.sync and obj.status.sync.revision
      if obj.operation ~= nil or op == nil or op.phase ~= "Succeeded" or
         op.syncResult == nil or revision == nil or op.syncResult.revision ~= revision then
        hs.status = "Progressing"
        hs.message = "Waiting for current revision public issuer hook"
        if op ~= nil and (op.phase == "Failed" or op.phase == "Error") then
          hs.status = "Degraded"
          hs.message = "Public issuer hook failed"
        end
      end
    end
    return hs
  resource.customizations.health.external-secrets.io_ExternalSecret: |
    hs = {status = "Progressing", message = "Waiting for Ready condition"}
    if obj.status ~= nil and obj.status.conditions ~= nil then
      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "Ready" then
          if condition.status == "True" and
             (condition.observedGeneration == nil or condition.observedGeneration == obj.metadata.generation) then
            hs.status = "Healthy"
            hs.message = "Ready"
          elseif condition.status == "False" then
            hs.status = "Degraded"
            hs.message = "Not Ready"
          end
        end
      end
    end
    return hs
  resource.customizations.health.external-secrets.io_SecretStore: |
    hs = {status = "Progressing", message = "Waiting for Ready condition"}
    if obj.status ~= nil and obj.status.conditions ~= nil then
      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "Ready" then
          if condition.status == "True" and
             (condition.observedGeneration == nil or condition.observedGeneration == obj.metadata.generation) then
            hs.status = "Healthy"
            hs.message = "Ready"
          elseif condition.status == "False" then
            hs.status = "Degraded"
            hs.message = "Not Ready"
          end
        end
      end
    end
    return hs
  resource.customizations.health.external-secrets.io_ClusterSecretStore: |
    hs = {status = "Progressing", message = "Waiting for Ready condition"}
    if obj.status ~= nil and obj.status.conditions ~= nil then
      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "Ready" then
          if condition.status == "True" and
             (condition.observedGeneration == nil or condition.observedGeneration == obj.metadata.generation) then
            hs.status = "Healthy"
            hs.message = "Ready"
          elseif condition.status == "False" then
            hs.status = "Degraded"
            hs.message = "Not Ready"
          end
        end
      end
    end
    return hs
  url: https://argocd.sgf.dev
  admin.enabled: "false"
  oidc.config: |
    name: Dex
    issuer: https://dex.sgf.dev
    clientID: argocd
    clientSecret: $oidc.argocd.clientSecret
    requestedScopes: ["openid", "profile", "email", "groups"]
