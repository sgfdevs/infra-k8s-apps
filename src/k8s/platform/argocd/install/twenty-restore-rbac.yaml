apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: twenty-restore-workflow
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["twenty"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: twenty-restore-workflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: twenty-restore-workflow
subjects:
  - kind: ServiceAccount
    name: twenty-restore-workflow
    namespace: twenty
