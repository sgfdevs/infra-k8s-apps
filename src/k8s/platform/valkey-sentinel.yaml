apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey-sentinel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: ssh://git@github.com/sgfdevs/infra-k8s-apps.git
    path: src/k8s/platform/services/valkey-sentinel
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: valkey-sentinel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
