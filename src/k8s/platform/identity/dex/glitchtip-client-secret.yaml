apiVersion: v1
kind: ServiceAccount
metadata:
  name: glitchtip-dex-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: glitchtip-openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc.cluster.local:8200
      path: applications
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: glitchtip-dex-secrets
          serviceAccountRef:
            name: glitchtip-dex-secrets
            audiences: [vault]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-glitchtip-client-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: glitchtip-openbao
  target:
    name: dex-glitchtip-client-secret
    creationPolicy: Owner
  data:
    - secretKey: glitchtipClientSecret
      remoteRef:
        key: glitchtip/oidc
        property: clientSecret
