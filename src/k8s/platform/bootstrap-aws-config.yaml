apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-aws-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    infra.sgf.dev/health-gate: "true"
spec:
  project: platform
  source:
    repoURL: ssh://git@github.com/sgfdevs/infra-k8s-apps.git
    path: src/k8s/platform/configuration-aws
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
