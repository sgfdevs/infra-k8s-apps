server:
  serviceAccount:
    name: openbao
    annotations:
      infra.sgf.dev/aws-role-arn: "arn:aws:iam::${SGFDEVS_AWS_ACCOUNT_ID}:role/sgfdevs-k3s/sgfdevs-k3s-openbao"
  annotations:
    eks.amazonaws.com/skip-containers: "prepare-recovery,recover-raft-or-join,openbao"
  volumes:
    - name: openbao-seal
      emptyDir:
        medium: Memory
    - name: aws-cli-home
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
    - name: openbao-recovery-work
      emptyDir:
        medium: Memory
    - name: openbao-recovery-config
      configMap:
        name: openbao-recovery
    - name: openbao-recovery-b2-credentials
      secret:
        secretName: k8up-b2-credentials
    - name: openbao-recovery-repository-password
      secret:
        secretName: openbao-k8up-repo-password
  volumeMounts:
    - name: openbao-seal
      mountPath: /openbao/seals
      readOnly: true
  extraInitContainers:
    - name: fetch-unseal-key
      image: amazon/aws-cli:2.35.16
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -euo pipefail
          echo "fetch-unseal-key: requesting unseal key from SSM..."
          aws ssm get-parameter \
            --with-decryption \
            --name /vm-workloads/sgfdevs/infra-vm-workloads/openbao-unseal-key \
            --query Parameter.Value \
            --output text \
            | tr -d '\n' > /openbao/seals/current.key
          key_byte_count=$(wc -c < /openbao/seals/current.key)
          echo "fetch-unseal-key: wrote ${key_byte_count} bytes to /openbao/seals/current.key"
          if [ "${key_byte_count}" -ne 44 ]; then
            echo "fetch-unseal-key: ERROR expected 44-byte base64 key, got ${key_byte_count}" >&2
            exit 1
          fi
          echo "fetch-unseal-key: done"
      env:
        - name: HOME
          value: /aws-home
      volumeMounts:
        - name: openbao-seal
          mountPath: /openbao/seals
        - name: aws-cli-home
          mountPath: /aws-home
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
    - name: prepare-recovery
      image: ghcr.io/k8up-io/k8up:v2.15.0
      command: ["/bin/bash", "/recovery-config/prepare.sh"]
      env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: RESTIC_REPOSITORY
          value: s3:https://s3.us-east-005.backblazeb2.com/sgfdevs-on-prem-k3s-backups/openbao
        - name: RESTIC_CACHE_DIR
          value: /tmp/restic-cache
      volumeMounts:
        - name: data
          mountPath: /openbao/data
        - name: openbao-recovery-work
          mountPath: /recovery
        - name: openbao-recovery-config
          mountPath: /recovery-config
          readOnly: true
        - name: openbao-recovery-b2-credentials
          mountPath: /recovery-credentials/b2
          readOnly: true
        - name: openbao-recovery-repository-password
          mountPath: /recovery-credentials/repository
          readOnly: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
    - name: recover-raft-or-join
      image: quay.io/openbao/openbao:2.5.5
      command: ["/bin/sh", "/recovery-config/recover.sh"]
      env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VAULT_CLIENT_TIMEOUT
          value: 10m
      volumeMounts:
        - name: data
          mountPath: /openbao/data
        - name: openbao-seal
          mountPath: /openbao/seals
          readOnly: true
        - name: openbao-recovery-work
          mountPath: /recovery
        - name: openbao-recovery-config
          mountPath: /recovery-config
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
