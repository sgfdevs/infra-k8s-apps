apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: visitor-http-forwarded-proto
  namespace: kube-system
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: visitor-https-redirect
  namespace: kube-system
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: visitor-http-redirect
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    # The tunnel uses HTTPS to reach Traefik even when the visitor used HTTP.
    - match: HeaderRegexp(`Cf-Visitor`, `http"`) && !PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      priority: 10000
      middlewares:
        - name: visitor-http-forwarded-proto
        - name: visitor-https-redirect
      services:
        - name: noop@internal
          kind: TraefikService
  tls: {}
