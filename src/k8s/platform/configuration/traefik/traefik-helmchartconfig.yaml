apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 3
      podAnnotations:
        secret.reloader.stakater.com/reload: cloudflared-sgfdevs-token,cloudflared-opensgf-token,traefik-tailnet-auth
      additionalVolumes:
        - name: cloudflared-no-api-token
          emptyDir:
            medium: Memory
        # Each node's replica keeps its identity separately from node Tailscale state.
        - name: traefik-tailnet-state
          hostPath:
            path: /var/lib/sgfdevs-traefik-tailnet
            type: DirectoryOrCreate
        - name: traefik-tailnet-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
      additionalContainers:
        - name: cloudflared-sgfdevs
          image: cloudflare/cloudflared:2026.8.2
          imagePullPolicy: IfNotPresent
          command:
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-sgfdevs-token
                  key: token
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          # Traefik needs its service account token; the connectors do not.
          volumeMounts:
            - name: cloudflared-no-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          ports:
            - name: sgf-metrics
              containerPort: 2000
          startupProbe:
            httpGet:
              path: /ready
              port: sgf-metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: sgf-metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: sgf-metrics
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: cloudflared-opensgf
          image: cloudflare/cloudflared:2026.8.2
          imagePullPolicy: IfNotPresent
          command:
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2001
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-opensgf-token
                  key: token
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cloudflared-no-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          ports:
            - name: osgf-metrics
              containerPort: 2001
          startupProbe:
            httpGet:
              path: /ready
              port: osgf-metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: osgf-metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: osgf-metrics
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: tailscale
          image: tailscale/tailscale:v1.88.4
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: traefik-tailnet-auth
                  key: authkey
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TS_HOSTNAME
              value: traefik-$(NODE_NAME)
            - name: TS_EXTRA_ARGS
              value: --login-server=https://headscale.levizitting.com --accept-routes=false
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_KUBE_SECRET
              value: ""
            # Filesystem state needs no Kubernetes client or service-account token.
            - name: KUBERNETES_SERVICE_HOST
              value: ""
            - name: TS_AUTH_ONCE
              value: "true"
          securityContext:
            # Override the chart's non-root policy for this sidecar only.
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: cloudflared-no-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: traefik-tailnet-state
              mountPath: /var/lib/tailscale
            - name: traefik-tailnet-tun
              mountPath: /dev/net/tun
          ports:
            - name: tailnet-udp
              containerPort: 41641
              protocol: UDP
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - 'tailscale status --json | grep -Eq ''"BackendState"[[:space:]]*:[[:space:]]*"Running"'''
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'tailscale status --json | grep -Eq ''"BackendState"[[:space:]]*:[[:space:]]*"Running"'''
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: traefik-kube-system
                app.kubernetes.io/name: traefik
            topologyKey: kubernetes.io/hostname
    ports:
      web:
        asDefault: true
        # Edge HTTP forwarding and local Cloudflared ACME requests.
        forwardedHeaders:
          trustedIPs:
            - 100.64.0.10/32
            - 127.0.0.1/32
          notAppendXForwardedFor: true
        http:
          middlewares:
            - kube-system-client-headers@kubernetescrd
      cloudflared:
        # Both connectors verify the public certificate for traefik.sgf.dev.
        port: 9443
        hostIP: 127.0.0.1
        asDefault: true
        expose:
          default: false
        protocol: TCP
        forwardedHeaders:
          trustedIPs:
            - 127.0.0.1/32
          notAppendXForwardedFor: true
        http:
          middlewares:
            - kube-system-client-headers@kubernetescrd
          tls:
            enabled: true
        transport:
          respondingTimeouts:
            readTimeout: 600s
            idleTimeout: 0
      websecure:
        asDefault: true
        http:
          middlewares:
            - kube-system-client-headers@kubernetescrd
        # Only the public edge may supply a PROXY-protocol visitor address.
        proxyProtocol:
          trustedIPs:
            - 100.64.0.10/32
        transport:
          respondingTimeouts:
            readTimeout: 600s
            idleTimeout: 0
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    tracing:
      otlp:
        enabled: true
        grpc:
          enabled: true
          endpoint: otelcol-collector.observability.svc.cluster.local:4317
          insecure: true
    logs:
      general:
        format: json
      access:
        enabled: true
        format: json
