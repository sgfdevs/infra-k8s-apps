apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-restore-workflow
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["zitadel"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-restore-workflow
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-restore-workflow
subjects:
  - kind: ServiceAccount
    name: zitadel-restore-workflow
    namespace: zitadel
