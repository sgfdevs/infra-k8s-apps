apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-role-probe
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: ssh://git@github.com/sgfdevs/infra-k8s-apps.git
    path: src/k8s/platform/services/redis-role-probe
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: kb-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - Validate=false
