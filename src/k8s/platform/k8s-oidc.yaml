apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    infra.sgf.dev/health-gate: "true"
    infra.sgf.dev/issuer-operation-gate: "true"
    infra.sgf.dev/issuer-input-fingerprint: "b24a72ba6d3c26da0d89e5023cbe4f3731d7ed79"
spec:
  project: platform
  source:
    repoURL: ssh://git@github.com/sgfdevs/infra-k8s-apps.git
    path: src/k8s/platform/services/k8s-oidc
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: k8s-oidc
  ignoreDifferences:
    - group: cert-manager.io
      kind: Certificate
      jsonPointers:
        - /spec/duration
        - /spec/renewBefore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
