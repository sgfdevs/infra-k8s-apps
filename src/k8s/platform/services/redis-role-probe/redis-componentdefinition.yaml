# Based on the Redis 1.0.2 addon ComponentDefinition redis-8-1.0.2.
# Pin this variant so the Helm-managed definition remains untouched.
# Rebase this copy when upgrading the Redis addon.
apiVersion: apps.kubeblocks.io/v1
kind: ComponentDefinition
metadata:
  name: redis-8-1.0.2-probe5
spec:
  configs:
  - externalManaged: true
    name: redis-replication-config
    namespace: kb-system
    template: redis8-config-template-1.0.2
    volumeName: redis-config
  - defaultMode: 292
    name: redis-metrics-config
    namespace: kb-system
    template: redis-metrics-config
    volumeName: redis-metrics-config
  description: A Redis v8.0 component definition for Kubernetes
  exporter:
    containerName: metrics
    scrapePath: /metrics
    scrapePort: http-metrics
  hostNetwork:
    containerPorts:
    - container: redis
      ports:
      - redis
    - container: metrics
      ports:
      - http-metrics
      - server-metrics
  lifecycleActions:
    accountProvision:
      exec:
        args:
        - 'redis-cli -a $REDIS_DEFAULT_PASSWORD $(KB_ACCOUNT_STATEMENT) && redis-cli -a $REDIS_DEFAULT_PASSWORD
          acl save '
        command:
        - sh
        - -c
        container: redis
      timeoutSeconds: 0
    memberJoin:
      exec:
        command:
        - /bin/bash
        - -c
        - /scripts/sync-acl.sh
        container: redis
        targetPodSelector: Any
      timeoutSeconds: 0
    postProvision:
      exec:
        command:
        - /bin/bash
        - -c
        - /scripts/redis-register-to-sentinel.sh > /tmp/post-provision.log 2>&1
        container: redis
        env:
        - name: CURRENT_POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: CURRENT_POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        - name: CURRENT_POD_HOST_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        matchingKey: primary
        targetPodSelector: Role
      preCondition: RuntimeReady
      timeoutSeconds: 0
    roleProbe:
      exec:
        command:
        - /tools/dbctl
        - --config-path
        - /tools/config/dbctl/components
        - redis
        - getrole
        container: redis
        env:
        - name: CURRENT_POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: KB_HOST_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        - name: KB_POD_FQDN
          value: $(CURRENT_POD_NAME).$(REDIS_COMPONENT_NAME)-headless.$(CLUSTER_NAMESPACE).svc.cluster.local
        - name: KB_CLUSTER_COMP_NAME
          value: $(REDIS_COMPONENT_NAME)
        - name: KB_SERVICE_PORT
          value: $(SERVICE_PORT)
      periodSeconds: 5
      timeoutSeconds: 1
    switchover:
      exec:
        command:
        - /bin/bash
        - -c
        - /scripts/redis-switchover.sh > /tmp/switchover.log 2>&1
        container: redis
      timeoutSeconds: 0
  logConfigs:
  - filePathPattern: /data/running.log
    name: running
  minReadySeconds: 10
  podManagementPolicy: OrderedReady
  podUpdatePolicy: PreferInPlace
  podUpgradePolicy: ReCreate
  policyRules:
  - apiGroups:
    - ''
    resources:
    - configmaps
    verbs:
    - create
    - get
    - list
    - patch
    - update
    - delete
  - apiGroups:
    - ''
    resources:
    - pods
    verbs:
    - get
    - list
  - apiGroups:
    - ''
    resources:
    - events
    verbs:
    - create
  - apiGroups:
    - apps.kubeblocks.io
    resources:
    - clusters
    verbs:
    - get
    - list
  provider: kubeblocks
  roles:
  - name: primary
    participatesInQuorum: false
    updatePriority: 2
  - name: secondary
    participatesInQuorum: false
    updatePriority: 1
  runtime:
    containers:
    - command:
      - /scripts/redis-start.sh
      env:
      - name: CURRENT_POD_NAME
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: metadata.name
      - name: CURRENT_POD_IP
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
      - name: CURRENT_POD_HOST_IP
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.hostIP
      - name: POD_FQDN
        value: $(CURRENT_POD_NAME).$(REDIS_COMPONENT_NAME)-headless.$(CLUSTER_NAMESPACE).svc.cluster.local
      imagePullPolicy: IfNotPresent
      lifecycle:
        preStop:
          exec:
            command:
            - /bin/bash
            - -c
            - /scripts/redis-pre-stop.sh
      name: redis
      ports:
      - containerPort: 6379
        name: redis
        protocol: TCP
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - /scripts/redis-ping.sh
        failureThreshold: 5
        initialDelaySeconds: 10
        periodSeconds: 5
        successThreshold: 1
        timeoutSeconds: 5
      resources: {}
      volumeMounts:
      - mountPath: /data
        name: data
      - mountPath: /etc/conf
        name: redis-config
      - mountPath: /scripts
        name: scripts
      - mountPath: /etc/redis
        name: redis-conf
      - mountPath: /tools
        name: tools
    - command:
      - /bin/agamotto
      - --config=/opt/conf/metrics-config.yaml
      env:
      - name: ENDPOINT
        value: localhost:$(SERVICE_PORT)
      - name: METRICS_HTTP_PORT
        value: $(REDIS_METRICS_HTTP_PORT)
      - name: METRICS_SERVER_PORT
        value: $(REDIS_METRICS_SERVER_PORT)
      - name: REDIS_USER
        value: $(REDIS_DEFAULT_USER)
      - name: REDIS_PASSWORD
        value: $(REDIS_DEFAULT_PASSWORD)
      imagePullPolicy: IfNotPresent
      name: metrics
      ports:
      - containerPort: 9121
        name: http-metrics
        protocol: TCP
      - containerPort: 8888
        name: server-metrics
        protocol: TCP
      resources: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      volumeMounts:
      - mountPath: /opt/conf
        name: redis-metrics-config
    initContainers:
    - command:
      - cp
      - -r
      - /bin/dbctl
      - /config
      - /tools/
      imagePullPolicy: IfNotPresent
      name: init-dbctl
      resources: {}
      volumeMounts:
      - mountPath: /tools
        name: tools
  scripts:
  - defaultMode: 365
    name: redis-scripts
    namespace: kb-system
    template: redis-scripts-template-1.0.2
    volumeName: scripts
  serviceKind: redis
  serviceVersion: 8.2.2
  services:
  - name: redis
    podService: false
    roleSelector: primary
    serviceName: redis
    spec:
      ports:
      - name: redis
        port: 6379
        protocol: TCP
        targetPort: redis
  - disableAutoProvision: true
    name: redis-advertised
    podService: true
    serviceName: redis-advertised
    spec:
      ports:
      - name: redis-advertised
        port: 6379
        protocol: TCP
        targetPort: redis
      type: NodePort
  - disableAutoProvision: true
    name: redis-lb-advertised
    podService: true
    serviceName: redis-lb-advertised
    spec:
      externalTrafficPolicy: Cluster
      ports:
      - name: redis-advertised
        port: 6379
        protocol: TCP
        targetPort: redis
      type: LoadBalancer
  systemAccounts:
  - initAccount: true
    name: default
    passwordGenerationPolicy:
      length: 10
      letterCase: MixedCases
      numDigits: 5
      numSymbols: 0
  updateStrategy: BestEffortParallel
  vars:
  - name: IS_REDIS8
    value: 'true'
  - name: CLUSTER_NAME
    valueFrom:
      clusterVarRef:
        clusterName: Required
  - name: CLUSTER_NAMESPACE
    valueFrom:
      clusterVarRef:
        namespace: Required
  - name: REDIS_DEFAULT_USER
    valueFrom:
      credentialVarRef:
        name: default
        username: Required
  - name: REDIS_DEFAULT_PASSWORD
    valueFrom:
      credentialVarRef:
        name: default
        password: Required
  - name: REDIS_REPL_USER
    value: kbreplicator
  - name: REDIS_REPL_PASSWORD
    valueFrom:
      credentialVarRef:
        name: default
        password: Required
  - name: REDIS_SENTINEL_USER
    value: kbreplicator-sentinel
  - name: REDIS_SENTINEL_PASSWORD
    valueFrom:
      credentialVarRef:
        name: default
        password: Required
  - name: COMPONENT_REPLICAS
    valueFrom:
      componentVarRef:
        optional: false
        replicas: Required
  - name: REDIS_ADVERTISED_PORT
    valueFrom:
      serviceVarRef:
        name: redis-advertised
        optional: true
        port:
          name: redis-advertised
          option: Required
  - name: REDIS_LB_ADVERTISED_PORT
    valueFrom:
      serviceVarRef:
        name: redis-lb-advertised
        optional: true
        port:
          name: redis-advertised
          option: Required
  - name: REDIS_LB_ADVERTISED_HOST
    valueFrom:
      serviceVarRef:
        host: Required
        loadBalancer: Required
        name: redis-lb-advertised
        optional: true
  - name: REDIS_POD_NAME_LIST
    valueFrom:
      componentVarRef:
        optional: false
        podNames: Required
  - name: REDIS_POD_FQDN_LIST
    valueFrom:
      componentVarRef:
        optional: false
        podFQDNs: Required
  - name: REDIS_COMPONENT_NAME
    valueFrom:
      componentVarRef:
        componentName: Required
        optional: false
  - name: REDIS_HOST_NETWORK_PORT
    valueFrom:
      hostNetworkVarRef:
        container:
          name: redis
          port:
            name: redis
            option: Required
        optional: true
  - expression: '{{if index . "REDIS_HOST_NETWORK_PORT"}}{{.REDIS_HOST_NETWORK_PORT}}{{else}}{{.SERVICE_PORT}}{{end}}'
    name: SERVICE_PORT
    value: '6379'
  - name: DBCTL_REDIS_SERVICE_PORT
    value: $(SERVICE_PORT)
  - name: REDIS_METRICS_HOST_NETWORK_PORT
    valueFrom:
      hostNetworkVarRef:
        container:
          name: metrics
          port:
            name: http-metrics
            option: Required
        optional: true
  - expression: '{{if index . "REDIS_METRICS_HOST_NETWORK_PORT"}}{{.REDIS_METRICS_HOST_NETWORK_PORT}}{{else}}{{.REDIS_METRICS_HTTP_PORT}}{{end}}'
    name: REDIS_METRICS_HTTP_PORT
    value: '9121'
  - name: REDIS_METRICS_HOST_NETWORK_SERVER_PORT
    valueFrom:
      hostNetworkVarRef:
        container:
          name: metrics
          port:
            name: server-metrics
            option: Required
        optional: true
  - expression: '{{if index . "REDIS_METRICS_HOST_NETWORK_SERVER_PORT"}}{{.REDIS_METRICS_HOST_NETWORK_SERVER_PORT}}{{else}}{{.REDIS_METRICS_SERVER_PORT}}{{end}}'
    name: REDIS_METRICS_SERVER_PORT
    value: '8888'
  - name: SENTINEL_COMPONENT_NAME
    valueFrom:
      componentVarRef:
        compDef: redis-sentinel-8-1.0.2
        componentName: Required
        optional: true
  - name: SENTINEL_USER
    valueFrom:
      credentialVarRef:
        compDef: redis-sentinel-8-1.0.2
        name: default
        optional: true
        username: Required
  - name: SENTINEL_HEADLESS_SERVICE_NAME
    valueFrom:
      serviceVarRef:
        compDef: redis-sentinel-8
        host: Optional
        name: headless
        optional: true
  - name: SENTINEL_PASSWORD
    valueFrom:
      credentialVarRef:
        compDef: redis-sentinel-8-1.0.2
        name: default
        optional: true
        password: Required
  - name: SENTINEL_POD_NAME_LIST
    valueFrom:
      componentVarRef:
        compDef: redis-sentinel-8-1.0.2
        optional: true
        podNames: Required
  - name: SENTINEL_POD_FQDN_LIST
    valueFrom:
      componentVarRef:
        compDef: redis-sentinel-8-1.0.2
        optional: true
        podFQDNs: Required
  - expression: '{{if index . "SENTINEL_SERVICE_PORT"}}{{.SENTINEL_SERVICE_PORT}}{{else}}26379{{end}}'
    name: SENTINEL_SERVICE_PORT
    valueFrom:
      hostNetworkVarRef:
        compDef: redis-sentinel-8-1.0.2
        container:
          name: redis-sentinel
          port:
            name: redis-sentinel
            option: Required
        optional: true
  - name: PHY_MEMORY
    valueFrom:
      resourceVarRef:
        memoryLimit: Required
  volumes:
  - highWatermark: 0
    name: data
    needSnapshot: true
