apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: aws-pod-identity-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aws-pod-identity-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: aws-pod-identity-webhook-tls
  dnsNames:
    - aws-pod-identity-webhook
    - aws-pod-identity-webhook.aws-pod-identity-webhook
    - aws-pod-identity-webhook.aws-pod-identity-webhook.svc
    - aws-pod-identity-webhook.aws-pod-identity-webhook.svc.cluster.local
  duration: 2160h
  renewBefore: 360h
  isCA: true
  issuerRef:
    name: aws-pod-identity-webhook
    kind: Issuer
