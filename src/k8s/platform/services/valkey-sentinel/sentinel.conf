port 26379
bind 0.0.0.0
protected-mode yes
daemonize no
logfile ""
dir /data
aclfile /run/sentinel/users.acl
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel announce-port 26379
sentinel deny-scripts-reconfig yes

# No applications are enrolled by this platform bootstrap.
# Enrollment must configure the same unique master name, quorum 2, backend
# credentials, and timeouts on all three voters using the sentinel-admin user.
# Discovery-only credentials must never be used for enrollment.
# Do not give Sentinel and another controller ownership of the same topology.
# Runtime MONITOR/SET state, discovered peers, elected primaries, identity and
# epochs are rewritten by Sentinel into /data/sentinel.conf and survive restarts.
