apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey-sentinel
spec:
  serviceName: valkey-sentinel-headless
  replicas: 3
  podManagementPolicy: Parallel
  revisionHistoryLimit: 3
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-sentinel
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: valkey-sentinel
              topologyKey: kubernetes.io/hostname
      containers:
        - name: sentinel
          image: docker.io/valkey/valkey:9.0.4@sha256:bdf93f670fdb026eba9e2cf852c3fa8062f92e850fa181626c3b056e83ef04cf
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/etc/sentinel-config/start.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: sentinel
              containerPort: 26379
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            exec:
              command: ["/bin/sh", "/etc/sentinel-config/probe.sh"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/bin/sh", "/etc/sentinel-config/probe.sh"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "/etc/sentinel-config/probe.sh"]
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/sentinel-config
              readOnly: true
            - name: auth
              mountPath: /etc/sentinel-auth
              readOnly: true
            - name: runtime
              mountPath: /run/sentinel
            - name: state
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: valkey-sentinel-config
        - name: auth
          secret:
            secretName: valkey-sentinel-auth
            defaultMode: 0440
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi
