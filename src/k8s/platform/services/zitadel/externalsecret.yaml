apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: zitadel-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: /vm-workloads/sgfdevs/infra-vm-workloads/zitadel/master-key
    - secretKey: initialAdminPassword
      remoteRef:
        key: /vm-workloads/sgfdevs/infra-vm-workloads/zitadel/initial-admin-password
