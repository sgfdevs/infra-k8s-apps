apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zitadel
resources:
  - ../backup-base
  - namespace.yaml
  - cluster.yaml
  - externalsecret.yaml
  - externalsecret-backup-credentials.yaml
  - backup-serviceaccount.yaml
  - login-service-certificate.yaml
  - middleware-https-redirect.yaml
  - certificate.yaml
  - ingress.yaml
  - backup-workflowtemplate.yaml
  - restore-workflowtemplate.yaml
  - resume-workflowtemplate.yaml
  - workflow-scripts.yaml
  - workflow-rbac.yaml
patches:
  - path: backup-patch.yaml
    target:
      group: k8up.io
      version: v1
      kind: PreBackupPod
      name: app-backup
  - path: schedule-patch.yaml
    target:
      group: k8up.io
      version: v1
      kind: Schedule
      name: app-backup
