apiVersion: batch/v1
kind: Job
metadata:
  name: oidc-public-readiness-b24a72ba6d3c26da0d89e5023cbe4f3731d7ed79
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: Argo CD owns hook cleanup; TTL deletion would cause drift.
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      # Bypass cluster split DNS. Keep normal public TLS verification.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: python:3.14.0-alpine3.22
          command: [python3, -B, /check/check-public.py]
          args: ["https://k8s-oidc.sgf.dev"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: check
              mountPath: /check
              readOnly: true
      volumes:
        - name: check
          configMap:
            name: oidc-public-check
