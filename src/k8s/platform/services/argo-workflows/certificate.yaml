apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argo-workflows-tls
  namespace: argo-workflows
spec:
  secretName: argo-workflows-tls
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
  dnsNames:
    - workflows.sgf.dev
