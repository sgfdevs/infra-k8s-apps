apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflows-admin
  namespace: argo-workflows
  annotations:
    workflows.argoproj.io/rbac-rule: "'sgfdevs:infra-platform-admins' in groups || 'sgfdevs:infra-maintainers' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-admin.service-account-token
  namespace: argo-workflows
  annotations:
    kubernetes.io/service-account.name: argo-workflows-admin
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-workflows-sso-admin
rules:
  - apiGroups: ["argoproj.io"]
    resources:
      - clusterworkflowtemplates
      - cronworkflows
      - workflowartifactgctasks
      - workfloweventbindings
      - workflows
      - workflows/finalizers
      - workflowtaskresults
      - workflowtasksets
      - workflowtemplates
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["events", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-workflows-sso-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-workflows-sso-admin
subjects:
  - kind: ServiceAccount
    name: argo-workflows-admin
    namespace: argo-workflows
