name: Kubernetes PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: glitchedmob/infra-gha/.github/workflows/k8s-pr-checks.yml@v0.11.3
    with:
      kubernetes-version: 1.36.2
      kustomization-roots: |
        src/k8s/bootstrap/operators/base
        src/k8s/bootstrap/operators/dependent
        src/k8s/bootstrap/projects
        src/k8s/apps
        src/k8s/platform

  bootstrap-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4.7"
      - name: Offline ownership contract
        run: |
          python3 -m venv .test-venv
          .test-venv/bin/pip install PyYAML
          .test-venv/bin/python -m unittest discover -s tests -v
