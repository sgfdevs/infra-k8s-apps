# Temporary branch-backed Application. After merge, the apps ApplicationSet
# discovers src/k8s/apps/twenty and manages this same Application from main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: twenty
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: ssh://git@github.com/sgfdevs/infra-k8s-apps.git
    path: src/k8s/apps/twenty
    targetRevision: feat/twenty-k8s
  destination:
    namespace: twenty
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - FailOnSharedResource=true
      - PruneLast=true
